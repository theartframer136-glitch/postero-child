name: Check Popup

# One question, asked alone: when you click a Products In Motion tile, does a
# video appear?
#
# It lived inside Check Home and its answer was unreadable twice — once the
# six-minute job ceiling cancelled it before it ran, once the log API returned
# only the tail and the verdict sat above a screenful of New Arrivals output.
# Alone, its verdict is the last line printed and the run has time to reach it.
#
# Read-only: it loads the live homepage in Chrome, clicks a tile, and measures.
# Nothing is written and no SSH is used.

on:
  workflow_dispatch:

jobs:
  popup:
    runs-on: ubuntu-latest
    # Generous, because this host can spend four and a half minutes refusing
    # to answer before it answers.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Click a motion tile and measure the popup
        run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afhead puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afhead/node_modules node tools/headless-motion-popup.js "https://theartframer.us/" || true
