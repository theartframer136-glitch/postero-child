name: Verify Circles Live

# Clicks a collection circle on the LIVE homepage with a real Chromium mouse
# and reports whether the products change — the exact check a human does.
# Manual trigger only; it makes a handful of page views and no server changes.
on: workflow_dispatch

concurrency:
  group: verify-circles
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium

      - name: Click a collection circle on the live homepage
        run: node tools/verify-circles-live.mjs

      - name: Upload before/after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circle-click-screens
          path: |
            before.png
            after.png
          if-no-files-found: ignore
