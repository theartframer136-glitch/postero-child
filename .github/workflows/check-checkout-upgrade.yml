name: Check Checkout Upgrade
# Read-only (no order placed): clicks each "Upgrade this piece" choice on the
# live checkout and checks the line price, details, delivery and total.
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afh puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afh/node_modules node tools/diag-checkout-upgrade.mjs || true
