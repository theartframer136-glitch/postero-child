name: Check Page HTML
# Read-only. Fetches pages as a guest (cache-busting query, so PHP builds them
# fresh) and prints every stylesheet, inline style and script tag in page
# order, plus the snippets matching an optional pattern. Used before a plugin
# is moved into the theme, to see exactly which tags and markup it puts there.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Pages, space separated (paths or full URLs)'
        required: true
      pattern:
        description: 'Regex for extra snippets to print (optional)'
        required: false
        default: ''
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      URLS: ${{ github.event.inputs.urls }}
      PATTERN: ${{ github.event.inputs.pattern }}
    steps:
      - name: Fetch and list
        run: |
          set +e
          cat > /tmp/list.py <<'EOS'
          import re, sys, os
          html = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'<(link|script|style)\b[^>]*>', html, re.I):
              tag = m.group(0)
              if m.group(1).lower() == 'link' and not re.search(r'stylesheet', tag, re.I):
                  continue
              i = re.search(r'\bid=["\']([^"\']+)', tag)
              s = re.search(r'\b(?:href|src)=["\']([^"\']+)', tag)
              if m.group(1).lower() in ('script', 'style') and not i and not s:
                  continue
              print('  %-7s %-40s %s' % (m.group(1).lower(), i.group(1) if i else '-', (s.group(1) if s else '(inline)')[:200]))
          p = os.environ.get('PATTERN', '')
          if p:
              print('--- snippets matching the pattern')
              for n, m in enumerate(re.finditer(r'.{0,160}(?:%s).{0,300}' % p, html, re.S)):
                  if n >= 40: break
                  print('  ' + re.sub(r'\s+', ' ', m.group(0)))
          EOS
          for u in $URLS; do
            case "$u" in http*) ;; *) u="https://theartframer.us$u";; esac
            case "$u" in *\?*) q="&afcheck=$RANDOM$RANDOM";; *) q="?afcheck=$RANDOM$RANDOM";; esac
            curl -sS -L -m 60 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
              -o /tmp/p.html -w "=== $u -> %{http_code}, %{size_download} bytes\n" "$u$q"
            python3 /tmp/list.py
            echo
          done
