name: Check Trashed Duplicates
# Read-only. The 17 lettered listings in the owner's workbook: their real
# status on the server (wp-cli), and whether any of the 10 trashed ones can
# still be seen on the public site (old link, search, sitemap, Store API).
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Server and public view
        run: |
          set +e
          ssh -p "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" '
            cd ~/websites/OPu0sKi4J/public_html
            S=https://theartframer.us
            echo "=== log of the removal (af_duplicate_listings) ==="
            timeout 60 wp option get af_duplicate_listings --allow-root 2>&1 | tail -1
            echo
            echo "=== the 10 duplicates: status on the server, and what the public sees ==="
            for row in \
              "17212|LR-070004-5030A|beautiful-lord-krishna-statue-canvas-wall-art|Beautiful Lord Krishna Statue" \
              "11541|RK-010002-3050A|premium-radha-krishna-love-wall-art-36x60-inches-spiritual-digital-canvas-print|Premium Radha Krishna Love Wall Art" \
              "11617|RK-010002-3050B|radha-krishna-canvas-wall-art-24x36-inches-floating-frame-premium-digital|Radha-Krishna Canvas Wall Art 24x36" \
              "24592|RK-010063-4030A|veena-under-violet-moon-canvas-wall-art|Veena Under Violet Moon" \
              "14678|RK-010090-5030A|golden-krishna-temple-idol-canvas-wall-art|Golden Krishna Temple Idol" \
              "26875|HD-080001-5030B|mahavatar-babaji-canvas-wall-art|Mahavatar Babaji" \
              "7839|LB-090001-3050B|buddha-lotus-serenity-canvas-wall-art|Buddha Lotus Serenity" \
              "17543|LR-070005-5030B|lord-balaji-idol-canvas-wall-art|Lord Balaji Idol" \
              "31829|RK-010033-3050B|krishna-flute-panorama-canvas-wall-art|Krishna Flute Panorama" \
              "31890|TP-050013-5030C|lord-vishnu-golden-halo-canvas-wall-art|Lord Vishnu Golden Halo"; do
              IFS="|" read -r id sku slug nm <<< "$row"
              st=$(timeout 40 wp post get "$id" --field=post_status --allow-root 2>&1 | tail -1)
              pub=$(timeout 40 wp post list --post_type=product --post_status=publish --meta_key=_sku --meta_value="$sku" --format=count --allow-root 2>&1 | tail -1)
              link=$(curl -s -o /dev/null -m 25 -w "%{http_code} -> %{redirect_url}" "$S/product/$slug/")
              q=$(printf %s "$nm" | sed "s/ /+/g")
              srch=$(curl -s -m 30 "$S/?s=$q&post_type=product" | grep -c "/product/$slug/")
              srch2=$(curl -s -m 30 "$S/?s=$sku&post_type=product" | grep -c "/product/$slug/")
              api=$(curl -s -m 30 "$S/wp-json/wc/store/v1/products?search=$q&per_page=50" | grep -o "\"id\":$id," | wc -l)
              echo "#$id $sku | server status: $st | published with this SKU: $pub | old link: $link | in search by name: $srch | by SKU: $srch2 | in store API: $api"
            done
            echo
            echo "=== product sitemap: any of the 10 old addresses listed? ==="
            SM=$(curl -s -m 30 "$S/sitemap_index.xml" | grep -o "https://[^<]*product-sitemap[^<]*" )
            [ -z "$SM" ] && SM="$S/product-sitemap.xml"
            ALL=""; for m in $SM; do ALL="$ALL$(curl -s -m 40 "$m")"; done
            echo "sitemaps read: $(echo $SM | wc -w)"
            for slug in beautiful-lord-krishna-statue-canvas-wall-art premium-radha-krishna-love-wall-art-36x60-inches-spiritual-digital-canvas-print radha-krishna-canvas-wall-art-24x36-inches-floating-frame-premium-digital veena-under-violet-moon-canvas-wall-art golden-krishna-temple-idol-canvas-wall-art mahavatar-babaji-canvas-wall-art buddha-lotus-serenity-canvas-wall-art lord-balaji-idol-canvas-wall-art krishna-flute-panorama-canvas-wall-art lord-vishnu-golden-halo-canvas-wall-art; do
              c=$(printf %s "$ALL" | grep -c "/product/$slug/"); echo "  $slug: $c"
            done
            echo
            echo "=== the 7 left live on purpose: status on the server ==="
            for id in 7824 19453 24836 7781 8424 8494 8474; do
              echo "#$id $(timeout 40 wp post get $id --field=post_status --allow-root 2>&1 | tail -1)"
            done
            echo
            echo "=== trash count for products ==="
            timeout 60 wp post list --post_type=product --post_status=trash --field=ID --allow-root 2>&1 | tr "\n" " "; echo
          '
