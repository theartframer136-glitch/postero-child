name: Check Wall Height Buttons
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afh puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afh/node_modules node tools/diag-wallft.mjs || true
