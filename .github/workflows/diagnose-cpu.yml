name: Diagnose CPU (read-only)

# Manual-only diagnostic: gathers evidence for the sustained high-CPU
# condition without deploying or changing anything on the host. Safe to run
# at any time — it makes no writes beyond /tmp scratch files on the server.
on:
  workflow_dispatch:

concurrency:
  group: diagnose-cpu
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Edge probes (no SSH — what does a visitor's request cost?)
        timeout-minutes: 5
        run: |
          set -uo pipefail
          probe() {
            echo "--- $1 $2"
            curl -s -D - -o /dev/null --max-time 45 -A "${3:-Mozilla/5.0 (X11; Linux x86_64) AF-DiagProbe}" "$2" \
              | tr -d '\r' | grep -i '^HTTP/\|^x-litespeed-cache\|^x-lsadc-cache\|^x-qc-\|^x-cache\|^age:\|^cache-control\|^x-af-guard\|^cf-cache-status' || true
          }
          # Twice each: first may be a MISS, second shows whether the page caches at all.
          probe "home #1" "https://theartframer.us/"
          probe "home #2" "https://theartframer.us/"
          probe "shop #1" "https://theartframer.us/shop/"
          probe "shop #2" "https://theartframer.us/shop/"
          probe "cat  #1" "https://theartframer.us/product-category/wall-art/"
          probe "cat  #2" "https://theartframer.us/product-category/wall-art/"
          # Guard must still answer bot junk cheaply:
          probe "guard: ahrefs UA" "https://theartframer.us/" "AhrefsBot/7.0"
          probe "guard: spam URL" "https://theartframer.us/items/spam-check"
          probe "guard: static 404" "https://theartframer.us/wp-content/uploads/nonexistent-diag.jpg"

      - name: Server-side diagnostic (read-only over one SSH connection)
        timeout-minutes: 15
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -uo pipefail
          SSH="ssh -p ${H_PORT} -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"

          # The host throttles SSH hard after deploy bursts — retry the first
          # (master) connection across the throttle window.
          OK=0
          for a in 1 2 3 4; do
            if ${SSH} "${H_USER}@${H_HOST}" "echo AF-SSH-OK"; then OK=1; break; fi
            echo "SSH refused (attempt $a) — waiting 75s for the throttle..."
            sleep 75
          done
          if [ "$OK" != "1" ]; then
            echo "::error::Could not reach the host over SSH after 4 attempts."
            exit 1
          fi

          echo "shell diagnostic..."
          ${SSH} "${H_USER}@${H_HOST}" "bash -s" < ops/diag-cpu.sh

          echo "wordpress diagnostic..."
          ${SSH} "${H_USER}@${H_HOST}" "cat > /tmp/af-diag-cpu.php" < ops/diag-cpu.php
          ${SSH} "${H_USER}@${H_HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && wp eval-file /tmp/af-diag-cpu.php --allow-root 2>&1; rm -f /tmp/af-diag-cpu.php"

          echo "Diagnostic complete."
