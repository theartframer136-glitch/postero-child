name: Health Check
# Is the site down, or is the host refusing this runner? Two vantage points in
# one run: plain HTTP from the runner, then the server's own view over SSH —
# load, memory, whether the web server answers on localhost, whether PHP
# answers at all, and the tail of the error log.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: HTTP from this runner
        run: |
          set +e
          for u in https://theartframer.us/ https://theartframer.us/shop/; do
            printf '%-40s ' "$u"
            curl -sS -o /dev/null -m 25 -w 'HTTP %{http_code}  connect %{time_connect}s  ttfb %{time_starttransfer}s  total %{time_total}s\n' "$u" 2>&1 || echo "FAILED"
          done
          echo; echo "resolves to:"; getent hosts theartframer.us || echo "  DNS lookup failed"
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: The server's own view
        run: |
          set +e
          ssh -p "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" '
            echo "=== SSH reached the server ==="
            echo; echo "--- load / uptime ---"; uptime
            echo; echo "--- memory (MB) ---"; free -m 2>/dev/null | head -2
            echo; echo "--- php processes ---"; ps aux 2>/dev/null | grep -c "[p]hp"
            echo; echo "--- HTTP from the server to itself ---"
            for u in "https://theartframer.us/" "https://theartframer.us/shop/"; do
              printf "%-36s " "$u"
              curl -sS -o /dev/null -m 25 -w "HTTP %{http_code}  ttfb %{time_starttransfer}s  total %{time_total}s\n" "$u" 2>&1 || echo "FAILED"
            done
            echo; echo "--- security headers on /checkout/, from the server itself ---"
            # Neither other vantage point can read these. The plain-HTTP user
            # agent is 403d by the host bot protection, and the headless probe
            # timed out on all six pages under load 49 and then reported "no
            # CSP" from having measured nothing at all. A request from the
            # server to itself is neither blocked nor slow, and checkout is
            # no-store so PHP always runs for it.
            curl -sSI -m 25 "https://theartframer.us/checkout/" 2>&1 \
              | grep -iE "^HTTP/|^content-security|^reporting-endpoints|^x-frame-options|^x-litespeed-cache" \
              | cut -c1-240 || echo "  (no headers read)"

          echo; echo "--- does PHP/WordPress answer at all (wp-cli) ---"
            cd ~/websites/OPu0sKi4J/public_html && timeout 60 wp option get siteurl --allow-root 2>&1 | tail -1
            echo; echo "--- DEF-10: did the one-time sitemap cache clear run (inc/robots-noindex.php) ---"
            # The probe sees whether the sitemap still lists the noindexed pages.
            # If it does, this says why: which Rank Math method ran, none, or failed.
            timeout 60 wp option get af_noindex_sitemap_flush --allow-root 2>&1 | tail -1
            echo; echo "--- DEF-13: which currency plugins are installed, and which are active ---"
            # The report counted two plugins from six cookies, but the theme
            # itself writes all six (functions.php, assets/js/custom.js). Only
            # the plugin list says what is actually running.
            timeout 60 wp plugin list --fields=name,status,version --allow-root 2>/dev/null \
              | grep -i -E "currenc|woocs|wmc|multi|aelia|wpml|wcml" || echo "  (no currency plugin matched)"
            echo "  options present:"
            timeout 60 wp option list --search="wmc*" --fields=option_name --allow-root 2>/dev/null | tail -n +2 | head -8 | sed "s/^/    /"
            timeout 60 wp option list --search="woocs*" --fields=option_name --allow-root 2>/dev/null | tail -n +2 | head -8 | sed "s/^/    /"
            echo; echo "--- the PHP error log ---"
            # tail -25 was useless the one time it mattered: two plugins emit a
            # _load_textdomain_just_in_time notice on every request, so the tail
            # is always the last twelve seconds of that and a fatal half an hour
            # back has long rolled off. Search instead of tailing.
            for f in ~/websites/OPu0sKi4J/public_html/wp-content/debug.log ~/websites/OPu0sKi4J/logs/error_log ~/logs/error_log; do
              [ -f "$f" ] || continue
              echo "[$f]  $(wc -l < "$f") lines, $(du -h "$f" | cut -f1)"
              echo
              echo "  -- fatals, parse errors and uncaught throwables (last 40) --"
              grep -E "PHP (Fatal|Parse|Recoverable)|Uncaught|Allowed memory size" "$f" 2>/dev/null | tail -40 \
                || echo "  (none in this file)"
              echo
              echo "  -- anything that is not a Notice, last 40 --"
              grep -v "PHP Notice" "$f" 2>/dev/null | grep -E "^\[" | tail -40 \
                || echo "  (nothing but notices)"
              echo
              echo "  -- how much of the log is that notice spam --"
              printf "  %s of %s lines\n" "$(grep -c "_load_textdomain_just_in_time" "$f" 2>/dev/null)" "$(wc -l < "$f")"
              echo
              # The count alone cannot say whether the filter works: any two
              # readings that straddle a deploy mix before and after. The
              # timestamp of the newest one can. Plenty of traffic reaches this
              # site between runs, so if the last notice is older than the last
              # deploy, nothing has written one since — and that is the answer.
              echo "  -- newest notice, and the time now --"
              printf "     newest: %s\n" "$(grep "_load_textdomain_just_in_time" "$f" 2>/dev/null | tail -1 | cut -c1-30)"
              printf "     now   : [%s]\n" "$(date -u "+%d-%b-%Y %H:%M:%S UTC")"
            done
            # No break: WordPress writes its own fatals to debug.log, but an
            # lsphp crash, an OOM kill or a hosting resource limit never
            # reaches PHP and lands in the server log instead. Stopping at the
            # first readable file is how an outage can leave no trace anywhere
            # you looked. Check every one of them.
            echo; echo "--- server-level logs, where PHP never gets a say ---"
            for f in ~/websites/OPu0sKi4J/logs/error_log ~/logs/error_log \
                     ~/websites/OPu0sKi4J/logs/*error* ~/domains/*/logs/*error*; do
              [ -f "$f" ] || continue
              echo "[$f]  $(wc -l < "$f") lines"
              tail -30 "$f" 2>/dev/null | cut -c1-300
              echo
            done
            echo; echo "--- LiteSpeed 5xx in the last hour, if the access log is readable ---"
            for f in ~/websites/OPu0sKi4J/logs/access_log ~/logs/access_log; do
              [ -f "$f" ] && { grep -c " 50[0-9] " "$f" 2>/dev/null; break; }
            done
            echo; echo "=== done ==="
          ' || echo "SSH FAILED — cannot reach the server at all"
