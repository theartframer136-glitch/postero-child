name: Audit Site

# Read-only passes over the live shop.
#
#   full  — the whole site, end to end:
#           crawl    every page in the sitemap and every page linked from them:
#                    status, redirects, PHP notices, soft 404s, placeholder
#                    text, product essentials, SEO head, every image, every
#                    external link (tools/audit-full.mjs)
#           browser  a real Chromium over a sample of every kind of page,
#                    desktop and phone: JS errors, failed requests, broken
#                    images, sideways scroll, then search, quick view, wishlist,
#                    menu, product → cart → checkout, the forms and the 404 page
#                    (tools/audit-browser.mjs), followed by the release
#                    checklist (tools/qa-veteran.mjs)
#   browser — the browser half of "full" on its own, over the key pages,
#           with no crawl in front of it to use up the host's patience
#   customer — the shop as a first-time visitor (desktop and phone) and as a
#           signed-in customer, on a throwaway account made for the run and
#           deleted after it (tools/qa-customer.mjs, qa-customer-session.php)
#   probe — read-only detail on the open items of the last full test
#           (tools/probe-site-details.mjs)
#   links — the older, lighter crawl: dead links, redirect chains, menus
#   perf  — load the key pages in a real Chrome and separate "the server is
#           slow" from "the page is heavy", which need opposite fixes
#
# Manual only. This host is CPU-bound; the crawls run three at a time with a
# pause between waves, and the browser job waits for the crawl to finish.
# Nothing is ever submitted that would reach a person or a ledger.

on:
  workflow_dispatch:
    inputs:
      pass:
        description: Which pass to run
        type: choice
        options: [full, browser, customer, probe, probe-hooks, probe-demo, probe-ux, probe-sort, both, links, perf]
        default: full
      max_pages:
        description: How many pages at most (full defaults to 2500, links to 160)
        type: string
        default: ''
      url:
        description: Site to test (blank = the live shop)
        type: string
        default: ''

concurrency:
  # The customer pass is light and paced; on the shared qa-live queue a run
  # queued by anyone else replaced it before it started (23 Oct). Its own queue.
  group: ${{ (inputs.pass == 'customer' || startsWith(inputs.pass, 'probe-')) && format('qa-light-{0}', inputs.pass) || 'qa-live' }}
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.pass == 'both' || inputs.pass == 'links' || inputs.pass == 'perf' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Links and navigation
        if: ${{ inputs.pass == 'both' || inputs.pass == 'links' }}
        run: node tools/audit-links.mjs "${{ inputs.url || 'https://theartframer.us' }}" "${{ inputs.max_pages || '160' }}" || true

      - name: Performance
        if: ${{ inputs.pass == 'both' || inputs.pass == 'perf' }}
        run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afhead puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afhead/node_modules node tools/audit-perf.mjs "${{ inputs.url || 'https://theartframer.us' }}" || true

  crawl:
    if: ${{ inputs.pass == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Crawl and check every page
        run: |
          set -o pipefail
          mkdir -p audit-out
          node tools/audit-full.mjs "${{ inputs.url || 'https://theartframer.us' }}" "${{ inputs.max_pages || '2500' }}" audit-out 2>&1 | tee audit-out/crawl.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-crawl
          path: audit-out
          if-no-files-found: warn

  browser:
    needs: crawl
    if: ${{ inputs.pass == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: site-test-crawl
          path: audit-out
      - name: Browser pass over the sampled pages and the visitor flows
        run: |
          set -o pipefail
          node tools/audit-browser.mjs "${{ inputs.url || 'https://theartframer.us' }}" audit-out/sample.json audit-out 2>&1 | tee audit-out/browser.log || true
      - name: Release-checklist pass
        run: |
          set -o pipefail
          node tools/qa-veteran.mjs "${{ inputs.url || 'https://theartframer.us' }}" 2>&1 | tee audit-out/veteran.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-browser
          path: |
            audit-out/browser.log
            audit-out/veteran.log
            audit-out/browser-findings.json
            audit-out/shots
            veteran-final.png
          if-no-files-found: warn

  browser-only:
    if: ${{ inputs.pass == 'browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium
      - name: Browser pass over the key pages and the visitor flows
        run: |
          set -o pipefail
          mkdir -p audit-out
          node tools/audit-browser.mjs "${{ inputs.url || 'https://theartframer.us' }}" "" audit-out 2>&1 | tee audit-out/browser.log || true
      - name: Release-checklist pass
        run: |
          set -o pipefail
          sleep 60
          node tools/qa-veteran.mjs "${{ inputs.url || 'https://theartframer.us' }}" 2>&1 | tee audit-out/veteran.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-browser
          path: |
            audit-out
            veteran-final.png
          if-no-files-found: warn

  probe:
    if: ${{ inputs.pass == 'probe' || startsWith(inputs.pass, 'probe-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium
      - name: Probe
        env:
          PROBE_ONLY: ${{ inputs.pass == 'probe-hooks' && 'hooks' || inputs.pass == 'probe-demo' && 'demo' || inputs.pass == 'probe-ux' && 'ux' || inputs.pass == 'probe-sort' && 'sort' || '' }}
        run: node tools/probe-site-details.mjs "${{ inputs.url || 'https://theartframer.us' }}" || true

  customer:
    if: ${{ inputs.pass == 'customer' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SSHO: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=40
      THEME: websites/OPu0sKi4J/public_html/wp-content/themes/postero-child
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Make the throwaway customer and a signed-in session for it
        run: |
          set +e
          scp -P "${{ secrets.HOSTINGER_PORT }}" $SSHO -i ~/.ssh/id_ed25519 tools/qa-customer-session.php \
            "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:~/$THEME/tools/qa-customer-session.php"
          OUT=$(ssh -p "${{ secrets.HOSTINGER_PORT }}" $SSHO -i ~/.ssh/id_ed25519 "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd ~/websites/OPu0sKi4J/public_html && AF_QA_ACTION=create timeout 120 wp eval-file wp-content/themes/postero-child/tools/qa-customer-session.php --allow-root 2>&1")
          JSON=$(printf '%s' "$OUT" | sed -n 's/.*@@SESSION@@\(.*\)@@END@@.*/\1/p' | head -1)
          printf '%s\n' "$OUT" | grep -v '@@SESSION@@' | grep -v 'Deprecated:' | grep -v '_load_textdomain' | tail -5
          if [ -n "$JSON" ]; then
            VAL=$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
            echo "::add-mask::$VAL"
            printf '%s' "$JSON" > "$RUNNER_TEMP/qa-session.json"
            echo "session ready (value masked)"
          else
            echo "::warning::no session was made; the signed-in journey will be skipped"
          fi
      - name: First visit and signed-in journeys
        run: |
          AF_QA_SESSION_FILE="$RUNNER_TEMP/qa-session.json" node tools/qa-customer.mjs "${{ inputs.url || 'https://theartframer.us' }}" 2>&1 | tee customer.log || true
          rm -f "$RUNNER_TEMP/qa-session.json"
      - name: Delete the throwaway customer
        if: always()
        run: |
          set +e
          ssh -p "${{ secrets.HOSTINGER_PORT }}" $SSHO -i ~/.ssh/id_ed25519 "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd ~/websites/OPu0sKi4J/public_html && AF_QA_ACTION=delete timeout 120 wp eval-file wp-content/themes/postero-child/tools/qa-customer-session.php --allow-root 2>&1 | grep -v -E 'Deprecated:|_load_textdomain' | tail -5"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-journey
          path: |
            customer.log
            customer-findings.json
            customer-*.png
          if-no-files-found: warn
