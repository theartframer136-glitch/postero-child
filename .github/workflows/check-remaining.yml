name: Check Remaining
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Who renders the empty hrefs
        run: node tools/diag-empty-href-src.mjs || true
      - name: What the homepage actually weighs, by host
        run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afh puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afh/node_modules node tools/diag-home-weight.mjs || true
