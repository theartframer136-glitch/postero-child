name: Check Search (server side)

# Ask WordPress itself what a search returns.
#
# Hostinger's CDN answers every https://theartframer.us/?s=... request with a
# 302 to "/" before WordPress sees it (measured 2026-09-09, nine queries,
# "server: hcdn"), so an HTTP check from outside can only ever report the
# homepage. This runs the query inside the server over SSH, where the answer
# is actually visible.
#
# Read-only: it runs WP_Query and prints results. Nothing is written.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # The probe carries itself up. Deploys on this repository are frequently
      # cancelled by the next push before they finish, so waiting for one to
      # ship a read-only diagnostic makes the diagnostic hostage to unrelated
      # traffic. One scp of one file costs a second and removes the dependency.
      - name: Send the probe up
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          scp -P "${PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 tools/search-probe.php \
              "${USER}@${HOST}:~/websites/OPu0sKi4J/public_html/wp-content/themes/postero-child/tools/search-probe.php" \
            || echo "  scp failed — falling back to whatever the last deploy left there"

      - name: Ask WordPress what the search finds
        timeout-minutes: 12
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/search-probe.php --allow-root 2>&1" \
            || true

      # A REAL HTTP request, made from inside the server.
      #
      # WP_Query says the search finds the piece; the owner's browser says
      # "Nothing Found". Both cannot be true of the same request, so the
      # difference is in what an actual page load does — plugins that only act
      # on a front-end request, a page cache, a second filter later in the
      # chain. None of that is visible to wp eval-file, and from outside the
      # CDN answers every search with a 302 before WordPress is reached.
      #
      # Asking the server to fetch its own URL over the loopback address, with
      # the site's Host header, goes through the whole WordPress stack exactly
      # as a visitor's request does.
      #
      # The Sec-Fetch-* headers are essential, not decoration. This site's own
      # crawl guard (ops/harden-crawl-budget.php) redirects a search to the
      # home page when Sec-Fetch-Mode is absent — real browsers always send it,
      # scrapers do not. Without these headers the check was tripping that rule
      # and reporting a 302 that no visitor ever sees, which I first, and
      # wrongly, blamed on the CDN.
      - name: Fetch a real search page from inside the server
        timeout-minutes: 10
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            'cd ~/websites/OPu0sKi4J/public_html && \
             for u in "?s=rk0118&afsearchdebug=1" "?s=rk0118&afsearch=off" \
                      "?s=Krishna&afsearchdebug=1" "?s=Krishna&afsearch=off"; do \
               echo "--- ${u} ---"; \
               curl -sS --max-time 45 -H "Host: theartframer.us" \
                    -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0.0.0" \
                    -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" \
                    -H "Sec-Fetch-Dest: document" -H "X-AF-Probe: 1" \
                    -o /dev/null -D /tmp/afh.txt \
                    -w "  first: http=%{http_code}\n" \
                    "https://127.0.0.1/${u}" --insecure 2>&1 || echo "  loopback fetch failed"; \
               echo -n "  redirects to: "; (grep -i "^location:" /tmp/afh.txt | tr -d "\r" | head -1) || true; echo; \
               curl -sSL --max-time 45 -H "Host: theartframer.us" \
                    -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/140.0.0.0" \
                    -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Site: none" \
                    -H "Sec-Fetch-Dest: document" -H "X-AF-Probe: 1" \
                    -o /tmp/afs.html -w "  followed: http=%{http_code} bytes=%{size_download} url=%{url_effective}\n" \
                    "https://127.0.0.1/${u}" --insecure 2>&1 || true; \
               if [ -s /tmp/afs.html ]; then \
                 echo -n "  Nothing Found: "; grep -qi "nothing found\|nothing matched" /tmp/afs.html && echo YES || echo no; \
                 echo -n "  product links: "; grep -o "/product/[a-z0-9-]*/" /tmp/afs.html | sort -u | wc -l; \
                 echo -n "  first product: "; (grep -o "/product/[a-z0-9-]*/" /tmp/afs.html | head -1) || true; echo; \
                 grep -o "<!-- af-search:[^>]*-->" /tmp/afs.html | cut -c1-400 | sed "s/^/  /" | head -4 || true; \
               fi; \
             done' \
            || true
