name: SSH Host Key
# Read-only. Prints the server's SSH host keys as hashed known_hosts lines,
# for .github/known_hosts: the deploy, run-diag and turnstile workflows check
# the server's identity against that file instead of trusting whatever
# answers (security audit, 12 Oct). Run it again if Hostinger ever changes
# the server's keys; the deploy then stops with "Host key verification
# failed" until the file is updated, and nothing on the site is touched.
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -uo pipefail
          ssh-keyscan -p "$H_PORT" -T 20 "$H_HOST" 2>/dev/null | sort > /tmp/kh
          echo "=== keys offered (fingerprints)"
          ssh-keygen -lf /tmp/kh
          cp /tmp/kh /tmp/kh.h && ssh-keygen -H -f /tmp/kh.h >/dev/null 2>&1
          echo "=== hashed known_hosts lines"
          cat /tmp/kh.h
          if [ -f .github/known_hosts ]; then
            echo "=== does .github/known_hosts match the server?"
            if ssh -p "$H_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/.github/known_hosts" -o ConnectTimeout=20 -o PreferredAuthentications=none "probe@$H_HOST" true 2>&1 | grep -qi "host key verification failed"; then
              echo "NO: the server's key is not in .github/known_hosts"; exit 1
            else
              echo "YES"
            fi
          fi
