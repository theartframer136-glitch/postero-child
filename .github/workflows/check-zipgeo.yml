name: Check ZIP Table
# Read-only. Which ZIPs the delivery calculator can locate.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Query
        run: |
          set +e
          ssh -p "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" '
            cd ~/websites/OPu0sKi4J/public_html
            P=$(timeout 30 wp --allow-root db prefix 2>/dev/null | tail -1)
            q() { timeout 60 wp --allow-root db query "$1" --skip-column-names 2>/dev/null; }
            echo "total rows: $(q "SELECT COUNT(*) FROM ${P}af_zip_geo")"
            for z in 19707 10118 10001 94043 99501 34444 96813 00601 20500 90210 60601 33101 09001 96201 34001 20252 75001 98101; do
              r=$(q "SELECT CONCAT(lat,\",\",lng) FROM ${P}af_zip_geo WHERE zip=\"$z\"")
              pre=${z:0:3}; n=$(q "SELECT COUNT(*) FROM ${P}af_zip_geo WHERE zip LIKE \"$pre%\"")
              printf "%s  %-24s prefix %s: %s zips\n" "$z" "${r:-MISSING}" "$pre" "$n"
            done
            echo "prefixes with no zips at all among 005-999:"
            q "SELECT LEFT(zip,3) p FROM ${P}af_zip_geo GROUP BY p" > /tmp/have.txt
            for i in $(seq -w 5 999); do p=$(printf "%03d" $((10#$i))); grep -qx "$p" /tmp/have.txt || printf "%s " "$p"; done; echo
          '
