name: Fetch Reels

# Put the Products In Motion reels ON the site, so the row plays local files
# and never a YouTube player — because a YouTube player draws YouTube's own
# furniture (loading spinner, previous/next, replay) inside its frame where no
# page CSS reaches, and the owner's requirement is a card with nothing on it
# but the moving picture. The lightbox keeps using YouTube on click; that part
# is wanted.
#
# WHY THIS RUNS HERE. The routes already measured and closed:
#   - the web host cannot run yt-dlp, cannot curl its own URL, and its PHP
#     HTTP layer is refused by YouTube's video CDN;
#   - the agent's own container has no route to YouTube at all.
# A GitHub runner CAN reach both YouTube and the host. One earlier attempt
# from a runner was refused ("confirm you're not a bot") — but that was one
# attempt with yt-dlp's default web client. yt-dlp ships several player
# clients precisely because they are gated differently; this tries them in
# turn per video and says plainly which worked. If every client is refused
# for every video, the summary says REFUSED and the row simply stays on its
# current YouTube frames — nothing breaks, and the schedule tries again
# tomorrow, since these gates come and go.
#
# Separate from Deploy Theme so one try costs ~3 minutes, not 17.

on:
  workflow_dispatch:
  schedule:
    # Daily, off-peak. New reels published on the channel get picked up and
    # planted on the site with nobody doing anything.
    - cron: '17 3 * * *'

# Shares the deploy's group: both talk SSH to the same throttle-happy host,
# and overlapping connection sprees are what starved runs 526/527/534.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Fetch the reels and plant them on the site
        timeout-minutes: 25
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
          # Optional. YouTube's wall literally asks to sign in, so signed-in
          # cookies are the one key that opens it. Paste a cookies.txt export
          # into this repo secret and every run uses it; absent, runs proceed
          # exactly as before. Never printed, never uploaded anywhere.
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -uo pipefail
          SITE="https://theartframer.us"
          SSH="ssh -p ${H_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600 -i $HOME/.ssh/id_ed25519"
          WEB="websites/OPu0sKi4J/public_html"
          DEST="${WEB}/wp-content/uploads/pim"

          echo "=== 1. Which reels does the row still need? ==="
          # The site's own answer, over public HTTP — the runner can reach it
          # even though the server cannot reach itself.
          IDS_RAW="$(curl -fsS --max-time 60 "${SITE}/?af_pim_ids=missing" || true)"
          # The sentinel is what separates "the endpoint answered: nothing
          # missing" from "a cached page or a challenge answered instead" —
          # misreading that exact difference once reported a total failure as
          # success and cost a deploy.
          if ! printf '%s\n' "$IDS_RAW" | head -1 | grep -q '^#af-pim-ids'; then
            echo "  The ids endpoint did not answer (first bytes follow):"
            printf '%s\n' "$IDS_RAW" | head -3 | cut -c1-120 | sed 's/^/    | /'
            echo "SUMMARY: INFRA-FAILED (ids endpoint unreachable — fetched nothing)"
            exit 1
          fi
          IDS="$(printf '%s\n' "$IDS_RAW" | tr -d '\r' | grep -E '^[A-Za-z0-9_-]{11}$' || true)"
          N=$(printf '%s\n' "$IDS" | grep -c . || true)
          echo "  reels without a local copy: $N"
          if [ "$N" = "0" ]; then
            echo "  Nothing to fetch — every card already plays from the site."
            echo "SUMMARY: NOTHING-MISSING"
            exit 0
          fi

          echo "=== 2. Downloader ==="
          # The standalone binary: pip on current runners refuses to install
          # into the system environment (externally-managed), and that failure
          # once hid inside a green step.
          curl -fsSL --retry 3 -o /usr/local/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version || { echo "SUMMARY: INFRA-FAILED (yt-dlp will not run)"; exit 1; }
          ffmpeg -version >/dev/null 2>&1 && echo "  ffmpeg present (merge available)"

          mkdir -p /tmp/reels
          # Cookies, if the owner has provided them (see env above). This is
          # what turns "Sign in to confirm you're not a bot" from a wall into
          # a door: the wall's own remedy is signing in.
          COOKIE_ARGS=""
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > /tmp/yt-cookies.txt
            chmod 600 /tmp/yt-cookies.txt
            COOKIE_ARGS="--cookies /tmp/yt-cookies.txt"
            echo "  cookies provided - using them"
          else
            echo "  no YT_COOKIES secret - anonymous attempt"
          fi
          # 720p is plenty for a 290px card; the merge branch first, or the
          # progressive stream is only ~360p.
          FMT='bv*[ext=mp4][height<=720]+ba[ext=m4a]/b[ext=mp4][height<=720]/b[height<=720]/b'
          # Differently-gated player clients, tried in turn. What one refuses
          # another often serves.
          # The embedded clients last: they are gated separately, because they
          # serve videos EMBEDDED on other sites — and these reels are
          # embeddable (the site's own lightbox plays them). What the watch
          # page refuses, the embedded player sometimes serves.
          CLIENTS="default android ios tv mweb web_embedded tv_embedded"

          GOT=0; REFUSED=0
          for id in $IDS; do
            OK=""
            for c in $CLIENTS; do
              EXTRA=""
              [ "$c" != "default" ] && EXTRA="--extractor-args youtube:player_client=$c"
              if yt-dlp --no-warnings --no-playlist $COOKIE_ARGS $EXTRA \
                   -f "$FMT" --merge-output-format mp4 --max-filesize 60M \
                   --socket-timeout 30 --retries 2 --sleep-requests 1 \
                   -o "/tmp/reels/${id}.mp4" \
                   "https://www.youtube.com/watch?v=${id}" >/tmp/reels/last.log 2>&1 \
                 && [ -s "/tmp/reels/${id}.mp4" ]; then
                OK="$c"; break
              fi
              rm -f "/tmp/reels/${id}.mp4" "/tmp/reels/${id}.mp4.part"
            done
            if [ -n "$OK" ]; then
              GOT=$((GOT+1))
              echo "  ok   ${id}.mp4  ($(du -h /tmp/reels/${id}.mp4 | cut -f1))  via client: ${OK}"
            else
              REFUSED=$((REFUSED+1))
              echo "  no   ${id} — every client refused. Last words:"
              tail -2 /tmp/reels/last.log | sed 's/^/       | /'
            fi
            sleep 2
          done
          echo "  downloaded ${GOT}, refused ${REFUSED}, of ${N}"

          if [ "$REFUSED" -gt 0 ]; then
            echo "=== 2b. Alternate frontends, for what YouTube itself refused ==="
            # First run's measurement: all five yt-dlp player clients now get
            # "Sign in to confirm you're not a bot" for every video — the wall
            # asks for account cookies, which nothing unattended has. Invidious
            # instances are YouTube frontends that fetch with their own tokens
            # and, with ?local=true, proxy the bytes through themselves — so
            # the runner only ever talks to the instance. Public instances come
            # and go; several are tried and each answer is verified to be an
            # actual MP4 (ftyp box) before it counts, because an instance's
            # error page saved as .mp4 would poison a card worse than no file.
            INSTANCES="yewtu.be inv.nadeko.net invidious.nerdvpn.de invidious.f5.si iv.melmac.space invidious.privacyredirect.com invidious.jing.rocks inv.tux.pizza vid.puffyan.us invidious.projectsegfau.lt"
            for id in $IDS; do
              [ -s "/tmp/reels/${id}.mp4" ] && continue
              for inst in $INSTANCES; do
                J="$(curl -fsSL --max-time 45 "https://${inst}/api/v1/videos/${id}?local=true" 2>/dev/null || true)"
                [ -n "$J" ] || continue
                # Highest progressive stream (video+audio in one file). These
                # top out around 720p, which is more than the 290px card needs.
                URL="$(printf '%s' "$J" | jq -r '(.formatStreams // []) | sort_by(.height // 0) | last | .url // empty' 2>/dev/null || true)"
                [ -n "$URL" ] || continue
                case "$URL" in /*) URL="https://${inst}${URL}";; esac
                if curl -fsSL --max-time 420 --retry 1 -o "/tmp/reels/${id}.mp4" "$URL" \
                   && [ -s "/tmp/reels/${id}.mp4" ] \
                   && head -c 64 "/tmp/reels/${id}.mp4" | grep -q ftyp; then
                  GOT=$((GOT+1)); REFUSED=$((REFUSED-1))
                  echo "  ok   ${id}.mp4  ($(du -h /tmp/reels/${id}.mp4 | cut -f1))  via ${inst}"
                  break
                fi
                rm -f "/tmp/reels/${id}.mp4"
              done
              [ -s "/tmp/reels/${id}.mp4" ] || echo "  no   ${id} — no frontend served it either"
              sleep 1
            done
            echo "  after frontends: downloaded ${GOT}, still refused ${REFUSED}, of ${N}"
          fi

          BUILT=0
          if [ "$REFUSED" -gt 0 ]; then
            echo "=== 2c. Build the site's own motion clip for what nothing will serve ==="
            # The reel itself is behind a sign-in wall, but its FRAMES are not:
            # the cover and the three storyboard stills are public, unsigned,
            # and served to this runner (measured - the headless check reads
            # maxresdefault pixel-by-pixel from here). A slow zoom across those
            # four frames, cross-faded, rendered to a real MP4: the card plays
            # an actual video file from the site, with nothing drawn on it,
            # because nothing is embedded. Named <id>.anim.mp4 - the ids
            # endpoint ignores that suffix on purpose, so the daily hunt for
            # the original continues and replaces the built clip whenever
            # YouTube finally serves it.
            # ubuntu-latest runners do not ship ffmpeg on PATH — measured, run
            # #3: sixteen "ffmpeg: command not found", zero clips. Installed
            # here, lazily, only when there is something to build.
            if ! command -v ffmpeg >/dev/null 2>&1; then
              echo "  installing ffmpeg..."
              sudo apt-get update -qq >/dev/null 2>&1 || true
              sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
            fi
            if ! ffmpeg -version >/dev/null 2>&1; then
              echo "  ffmpeg unavailable - cannot build clips this run"
            fi
            HAVE_ANIM="$(${SSH} "${H_USER}@${H_HOST}" "ls ~/${DEST} 2>/dev/null" </dev/null || true)"
            for id in $IDS; do
              [ -s "/tmp/reels/${id}.mp4" ] && continue
              printf '%s\n' "$HAVE_ANIM" | grep -qx "${id}.anim.mp4" && { echo "  have ${id}.anim.mp4 already"; continue; }
              T=/tmp/frames-$id; mkdir -p "$T"
              curl -fsSL --max-time 30 -o "$T/f0.jpg" "https://i.ytimg.com/vi/${id}/maxresdefault.jpg" \
                || curl -fsSL --max-time 30 -o "$T/f0.jpg" "https://i.ytimg.com/vi/${id}/hqdefault.jpg" || true
              for k in 1 2 3; do
                curl -fsSL --max-time 30 -o "$T/f$k.jpg" "https://i.ytimg.com/vi/${id}/hq${k}.jpg" || true
              done
              NF=$(ls "$T"/f*.jpg 2>/dev/null | wc -l)
              if [ "$NF" -lt 4 ]; then echo "  no   ${id} - only $NF frames reachable"; rm -rf "$T"; continue; fi
              if ffmpeg -hide_banner -v error -y \
                   -i "$T/f0.jpg" -i "$T/f1.jpg" -i "$T/f2.jpg" -i "$T/f3.jpg" \
                   -filter_complex "\
          [0:v]crop=ih*9/16:ih,scale=1440:2560,zoompan=z='min(1.12,1+0.0013*on)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=96:s=720x1280:fps=24,setsar=1[v0];\
          [1:v]crop=ih*9/16:ih,scale=1440:2560,zoompan=z='max(1.0,1.12-0.0013*on)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=96:s=720x1280:fps=24,setsar=1[v1];\
          [2:v]crop=ih*9/16:ih,scale=1440:2560,zoompan=z='min(1.12,1+0.0013*on)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=96:s=720x1280:fps=24,setsar=1[v2];\
          [3:v]crop=ih*9/16:ih,scale=1440:2560,zoompan=z='max(1.0,1.12-0.0013*on)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=96:s=720x1280:fps=24,setsar=1[v3];\
          [v0][v1]xfade=transition=fade:duration=0.6:offset=3.4[x1];\
          [x1][v2]xfade=transition=fade:duration=0.6:offset=6.8[x2];\
          [x2][v3]xfade=transition=fade:duration=0.6:offset=10.2[out]" \
                   -map "[out]" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
                   -movflags +faststart -an "/tmp/reels/${id}.anim.mp4" \
                 && [ -s "/tmp/reels/${id}.anim.mp4" ]; then
                BUILT=$((BUILT+1))
                echo "  built ${id}.anim.mp4  ($(du -h /tmp/reels/${id}.anim.mp4 | cut -f1))"
              else
                rm -f "/tmp/reels/${id}.anim.mp4"
                echo "  no   ${id} - ffmpeg failed"
              fi
              rm -rf "$T"
            done
            echo "  clips built from public frames: ${BUILT}"
          fi

          if [ "$GOT" = "0" ] && [ "$BUILT" = "0" ]; then
            echo "SUMMARY: REFUSED (nothing fetched and nothing to build; row unchanged, retrying on schedule)"
            exit 0
          fi

          echo "=== 3. Plant them on the site ==="
          ${SSH} "${H_USER}@${H_HOST}" "mkdir -p ~/${DEST}"
          scp -p -P "${H_PORT}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p \
            -i ~/.ssh/id_ed25519 \
            /tmp/reels/*.mp4 "${H_USER}@${H_HOST}:~/${DEST}/" \
            || { echo "SUMMARY: INFRA-FAILED (upload)"; exit 1; }
          ${SSH} "${H_USER}@${H_HOST}" "chmod 644 ~/${DEST}/*.mp4 2>/dev/null; ls -la ~/${DEST} | tail -20"

          echo "=== 4. Fresh pages, so the cards learn about their files ==="
          ${SSH} "${H_USER}@${H_HOST}" \
            "cd ~/${WEB} && \
             wp litespeed-purge all --allow-root 2>/dev/null || true; \
             wp cache flush --allow-root 2>/dev/null || true; \
             echo '  caches cleared'" || echo "  (cache clear skipped)"

          echo "=== 5. Prove it, from outside ==="
          FIRST=$(ls /tmp/reels/*.mp4 | head -1 | xargs -n1 basename)
          echo "  HEAD ${SITE}/wp-content/uploads/pim/${FIRST}:"
          curl -fsSI --max-time 60 "${SITE}/wp-content/uploads/pim/${FIRST}" \
            | grep -iE '^(HTTP|content-type|content-length)' | sed 's/^/    /' \
            || { echo "SUMMARY: INFRA-FAILED (uploaded file not reachable over HTTP)"; exit 1; }
          LEFT_RAW="$(curl -fsS --max-time 60 "${SITE}/?af_pim_ids=missing" || true)"
          LEFT=$(printf '%s\n' "$LEFT_RAW" | tr -d '\r' | grep -cE '^[A-Za-z0-9_-]{11}$' || true)
          echo "  reels still missing after this run: ${LEFT} (was ${N})"
          # And the page itself: cards carry data-mp4 only when the file is on
          # disk, so counting them on the LIVE homepage is the end-to-end proof.
          CARDS=$(curl -fsS --max-time 90 "${SITE}/?afpim=$(date +%s)" | grep -o 'data-mp4' | wc -l || true)
          echo "  data-mp4 cards on the live homepage: ${CARDS} (each card appears twice: row + seamless copy)"
          echo "SUMMARY: PLANTED ${GOT} original reel(s) + ${BUILT} built clip(s); ${LEFT} originals still missing"
