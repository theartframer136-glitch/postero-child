name: Check Home

# A one-minute look at the live homepage.
#
# Every question about this row has cost a full deploy — seventeen minutes of
# rsync, script suites and audits — to answer something a single fetch can
# settle. This does only that. No SSH, no upload, nothing written.
#
# IT FETCHES AS A BROWSER. Measured 2026-09-08: a plain curl of the homepage
# contains no "Arrivals" anywhere, while a real browser on the same URL shows
# the heading — so the host serves a different page to a bare request (a cache
# variant, or a bot rule). Every raw-HTML measurement before this was reading a
# page the owner never sees. The headers below are what the owner's Chrome
# sends.
#
# Run it from the Actions tab, or it runs itself after every deploy finishes.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Theme"]
    types: [completed]

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: What the browser sees
        run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afhead puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afhead/node_modules node tools/headless-new-arrivals.js "https://theartframer.us/" || true

      - name: What the server sends
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          # Retried, because this host flaps: the same URL returned 943KB at
          # 10:56 and timed out three times at 11:01. One failed fetch proves
          # nothing about the page.
          fetch () {   # $1 = label, $2 = user-agent
            for try in 1 2 3; do
              if curl -fsS --max-time 60 -o "/tmp/$1.html" \
                   -H "User-Agent: $2" \
                   -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
                   -H 'Accept-Language: en-US,en;q=0.9' \
                   "https://theartframer.us/?cb=$(date +%s)$1$try"; then
                echo "  fetched $1 on try $try"
                return 0
              fi
              sleep 10
            done
            echo "  FETCH FAILED $1 after 3 tries — the host did not answer"
          }
          fetch browser "${UA}"
          fetch bare 'curl/8'
          # The New Arrivals rule promises "today's uploads, else random". Two
          # fetches, two lists of product ids: if they are identical the row is
          # not random, whatever the code says. Verified rather than assumed.
          curl -fsS --max-time 60 -o /tmp/na1.html -H "User-Agent: ${UA}" "https://theartframer.us/?nacheck=1$(date +%s)" || true
          sleep 3
          curl -fsS --max-time 60 -o /tmp/na2.html -H "User-Agent: ${UA}" "https://theartframer.us/?nacheck=2$(date +%s)" || true
          python3 - <<'NA'
          import re, os
          def grid(p):
              if not os.path.exists(p): return []
              h = open(p, encoding='utf-8', errors='replace').read()
              i = h.find('new-arrival-grid')
              if i < 0: return []
              seg = h[i:i+40000]
              # stop at the end of the shortcode block
              end = seg.find('elementor-element-1078153')
              if end > 0: seg = seg[:end]
              return re.findall(r'add-to-cart=(\d+)', seg)[:14]
          a, b = grid('/tmp/na1.html'), grid('/tmp/na2.html')
          print('\n=== New Arrivals: what is actually in the row ===')
          print('  fetch 1 product ids: %s' % (a or '(none found)'))
          print('  fetch 2 product ids: %s' % (b or '(none found)'))
          if not a:
              print('  VERDICT: no products in the grid')
          elif a == b:
              print('  VERDICT: the SAME products both times — not random')
          else:
              print('  VERDICT: different products each fetch — the random pick is working')
          NA

          python3 - <<'PY'
          import re, os

          def load(p):
              return open(p, encoding='utf-8', errors='replace').read() if os.path.exists(p) else ''

          for label in ('browser', 'bare'):
              h = load('/tmp/%s.html' % label)
              print('\n=== fetched as %s: %d bytes ===' % (label, len(h)))
              if not h:
                  continue

              # "rrival" survives <span>New</span> Arrivals and most encodings.
              hits = [m.start() for m in re.finditer(r'rrival', h, re.I)]
              print('  "rrival" occurrences: %d' % len(hits))

              print('  --- product markup ---')
              for pat in ('class="products', 'class="product ', 'product-card', 'productGrid',
                          'swiper-wrapper', 'eael-woo-product-carousel'):
                  print('    %-26s %d' % (pat, h.count(pat)))

              if hits:
                  i = hits[0]
                  print('  --- 45 tags after the first "rrival" ---')
                  for t in re.findall(r'<[^>]{1,150}>', h[i:i+6000])[:45]:
                      print('    ' + t[:150])

          h = load('/tmp/browser.html')
          if h:
              print('\n=== rules that hide things (browser fetch) ===')
              seen = set()
              for m in re.finditer(r'[^{};]{0,110}\{[^{}]{0,150}display\s*:\s*none[^{}]{0,80}\}', h):
                  t = re.sub(r'\s+', ' ', m.group(0)).strip()[:190]
                  if t not in seen and ('elementor-element-' in t or 'product' in t or 'swiper' in t):
                      seen.add(t)
                      print('  ' + t)

              print('\n=== is the new code live? ===')
              for label, needle in {
                  'OLD rule (hid the whole container)': 'elementor-element-d49c1e8{display:none',
                  'NEW rule (video widgets only)':      'elementor-widget-n-carousel',
                  'guard: un-hide product rows':        'unhideProductRows',
              }.items():
                  print('  %-38s %s' % (label, 'PRESENT' if needle in h else 'absent'))
          PY
