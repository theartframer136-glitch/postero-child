      - name: Safety enforcement (always)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"

          echo "Disabling LiteSpeed image lazy-load + JS defer/combine (keep Instagram embed + products visible)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp litespeed-option set media-lazy false --allow-root 2>&1; \
             wp litespeed-option set media-iframe_lazy false --allow-root 2>&1; \
             wp litespeed-option set optm-js_defer 0 --allow-root 2>&1; \
             wp litespeed-option set optm-js_comb false --allow-root 2>&1; \
             wp litespeed-option get media-lazy --allow-root 2>&1" \
            || true

          echo "Dropping tracker query params from the cache key (ad-click URLs share one cache entry instead of each being a full-render MISS)..."
          # Purge ONLY when the value actually changed. This setting is stable
          # across deploys, so the unconditional purge that used to sit here
          # emptied the whole page cache on every run for no reason — and a cold
          # cache is exactly what makes CPU spike afterwards.
          QSOUT=$(${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp option update litespeed.conf.cache-drop_qs --format=json '[\"fbclid\",\"gclid\",\"gbraid\",\"wbraid\",\"msclkid\",\"ttclid\",\"igshid\",\"mc_cid\",\"mc_eid\",\"utm_source\",\"utm_medium\",\"utm_campaign\",\"utm_term\",\"utm_content\",\"utm_id\"]' --allow-root 2>&1") \
            || true
          printf '%s\n' "$QSOUT"
          if printf '%s' "$QSOUT" | grep -qi 'unchanged'; then
            echo "  drop_qs already correct — skipping the purge."
          else
            echo "  drop_qs changed — purging so the new cache key takes effect."
            ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && wp litespeed-purge all --allow-root 2>/dev/null || true" || true
          fi

          echo "Recovery: clear maintenance flag + disable blanket auto-updates..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/recover-maintenance.php --allow-root 2>&1" \
            || true

          echo "Writing security headers into docroot .htaccess..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/set-security-headers.php --allow-root 2>&1" \
            || true

          echo "Crawl guard: spam-URL 410s, headerless-search 403s, cheap static 404s (the CPU fix)..."
          # Unlike the other scripts, a silent failure here means the CPU fix
          # is NOT live while the deploy shows green. Run #526 proved grepping
          # for the FAIL marker is not enough: Hostinger's SSH throttle refused
          # the connection outright, GUARD_OUT held only an ssh error, and the
          # step passed. So also require the script's own completion marker,
          # retrying across the throttle window before failing the deploy.
          GUARD_OK=0
          for a in 1 2 3; do
            GUARD_OUT=$(${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp eval-file wp-content/themes/postero-child/ops/harden-crawl-budget.php --allow-root 2>&1") \
              || true
            printf '%s\n' "$GUARD_OUT"
            if printf '%s' "$GUARD_OUT" | grep -q "AF-GUARD-FAIL:"; then
              echo "::error::Crawl guard did not apply cleanly — see the AF-GUARD-FAIL line above."
              exit 1
            fi
            if printf '%s' "$GUARD_OUT" | grep -q "=== DONE ==="; then
              GUARD_OK=1
              break
            fi
            echo "Crawl guard did not run to completion (attempt $a of 3) — likely SSH throttle; waiting 75s..."
            sleep 75
          done
          if [ "$GUARD_OK" != "1" ]; then
            echo "::error::Crawl guard never ran to completion after 3 attempts — the CPU fix is NOT live."
            exit 1
          fi
          if printf '%s' "$GUARD_OUT" | grep -q "AF-GUARD-WARN:"; then
            echo "::warning::Crawl guard applied with a caveat — see the AF-GUARD-WARN line above."
          fi

          # External search gate: THIS runner provably reaches the site through
          # the CDN, unlike the installer's origin-side probe. If a browser-
          # headed search trips the guard's own marker, Sec-Fetch headers are
          # being eaten in transit — strip the search rule (persisted) so
          # customer search can never break, then prove it clear.
          echo "GATE: browser-headed search through the CDN must not trip the guard..."
          SGATE=$(curl -s -D - -o /dev/null --max-time 45 \
            -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' -H 'Sec-Fetch-Dest: document' \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AF-SearchGate' \
            "https://theartframer.us/?s=af-gate-${RANDOM}${RANDOM}" | tr -d '\r' | grep -i '^x-af-guard:' || true)
          if [ -n "$SGATE" ]; then
            echo "::warning::Guard fired on a browser-headed search (${SGATE}) — stripping the search rule..."
            ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp eval-file wp-content/themes/postero-child/ops/harden-crawl-budget.php strip-search --allow-root 2>&1" \
              || true
            SGATE2=$(curl -s -D - -o /dev/null --max-time 45 \
              -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' -H 'Sec-Fetch-Dest: document' \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AF-SearchGate' \
              "https://theartframer.us/?s=af-gate2-${RANDOM}${RANDOM}" | tr -d '\r' | grep -i '^x-af-guard:' || true)
            if [ -n "$SGATE2" ]; then
              echo "::error::Search still trips the guard after strip-search (${SGATE2}) — customer search may be broken."
              exit 1
            fi
            echo "Search rule stripped and verified clear."
          else
            echo "Search gate clear."
          fi

