name: Deploy Theme

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      # Reading the live database is only possible from inside a deploy, and a
      # full one spends ~45 WP-CLI blocks and a quarter of an hour before it
      # reaches the read-only checks at the end. Worse, that connection spree is
      # what makes the NEXT run's rsync get refused by the host's throttle — run
      # 822 spent 26 minutes being turned away and never deployed at all,
      # because run 821 seventeen minutes earlier had used up the allowance.
      # This asks a question without paying either cost: rsync the theme, skip
      # every writing pass, run the read-only diagnostics.
      diag_only:
        description: 'Diagnostics only — deploy the code, skip every catalogue script'
        type: boolean
        default: false
      # Which artwork the Gold Foiled & UV importer should build from. Set here
      # rather than committed, because it is an instruction for one run and not
      # a fact about the theme — and because the answer depends on what the
      # diagnostics find in the live database, which nothing in the repo knows.
      #   category:personalised-prints   every published piece in that category
      #   products:1234,5678             these pieces
      #   media:fresh                    new Media Library uploads (the default)
      #   off                            stop importing entirely
      goldfoil_source:
        description: 'Gold Foiled & UV source (e.g. category:some-slug). Blank changes nothing.'
        type: string
        default: ''
      # How many pieces one run may create. The section is meant to be a
      # premium line, not a second copy of the catalogue, so this starts small
      # and is raised deliberately rather than defaulting to "all of it".
      goldfoil_max:
        description: 'Most products the import may create in one run (blank = leave as is)'
        type: string
        default: ''
      # Takes back out the pieces that were COPIED from artwork already in the
      # catalogue, leaving anything imported from a real file untouched.
      goldfoil_remove_copies:
        description: 'Remove the Gold Foiled & UV pieces copied from existing products'
        type: boolean
        default: false
      # The address of a folder living somewhere else — a Synology share link,
      # Dropbox, Drive. Set once; the site then polls it on a schedule and turns
      # anything new into products with nobody uploading anything.
      goldfoil_watch_url:
        description: 'Watch this folder link and auto-import new artwork (blank = leave as is)'
        type: string
        default: ''
      goldfoil_sync_now:
        description: 'Fetch from the watched link immediately, without waiting for the schedule'
        type: boolean
        default: false

# One deploy at a time. Two overlapping runs each rsync --delete the theme and
# fire a dozen WP-CLI processes at the same shared host, which is enough to hit
# Hostinger's resource limit and take the site to HTTP 508 while they run.
# Queue instead of cancelling: every pushed commit still gets deployed.
# Keep exactly one of these blocks. GitHub rejects a workflow that repeats a
# top-level key: the run fails instantly with no jobs and its name falls back
# to the file path, which is what happened to run #518 and again to run #886.
# Most YAML parsers accept a duplicate key silently and keep the last one, so
# a clean local parse is not evidence that this file is valid.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The contact sheets are delivered by pushing them to a branch, because the
    # log cannot carry them. See the two sheet steps near the end of this file.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the light-deploy guard can diff the pushed range
          fetch-depth: 0

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy (rsync + opcache + mode decision)
        timeout-minutes: 55
        # All ${{ }} live here, NOT in the run block: a run block containing
        # any expression is compiled as one template capped at 21000 chars,
        # and this script is far past that.
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_DIAG_ONLY: ${{ inputs.diag_only }}
          GH_BEFORE: ${{ github.event.before }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          USER="$H_USER"
          HOST="$H_HOST"
          PORT="$H_PORT"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"
          echo "Deploying to: ${TARGET}"

          echo "EMERGENCY: clearing any stuck WordPress maintenance-mode flag..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html 2>/dev/null && rm -f .maintenance && (wp maintenance-mode deactivate --allow-root 2>&1 || true)" \
            || echo "  (early clear skipped — will retry via recover-maintenance.php after rsync)"

          # ControlMaster multiplexing (the -o Control* options on every SSH
          # var in this file) makes the whole deploy share ONE ssh connection
          # instead of opening 10+ — Hostinger's throttle counts connections,
          # and that spree is what starved runs #526/527/534. Connection reuse
          # is what actually tamed the throttle, so the pre-wait is a short
          # grace, and the rsync retry ladder below remains the safety net.
          # A deploy that follows close on another's heels is the one most
          # likely to be refused, so the grace before the first attempt scales
          # with how recently this workflow last ran against the host.
          echo "Waiting 30s for any SSH throttle to clear..."
          sleep 30

          # The ladder has to outlast the throttle, or it converts a wait into
          # a failure and someone has to notice and retry by hand. Twice now it
          # has not: run 822 spent 26 minutes being refused and gave up, and so
          # did run 830 — both times the change simply never reached the site
          # and the page still looked wrong. Eight attempts on a rising delay
          # spans roughly 50 minutes, inside the step's own 55, so a throttled
          # deploy waits the host out instead of dying at the half hour.
          MAX=8
          DELAY=90
          DEPLOYED=0
          for i in $(seq 1 $MAX); do
            echo "Attempt $i of $MAX..."
            if rsync -avz --delete \
              --exclude ".git" \
              --exclude ".github" \
              --exclude "node_modules" \
              -e "${SSH} -i ~/.ssh/id_ed25519" \
              ./ \
              "${USER}@${HOST}:${TARGET}/"; then
              DEPLOYED=1
              break
            fi
            if [ $i -eq $MAX ]; then
              echo "All $MAX attempts failed."
              exit 1
            fi
            echo "Throttled — waiting ${DELAY}s before retry..."
            sleep $DELAY
            DELAY=$((DELAY + 90))
          done

          echo "Restarting PHP workers (opcache holds modified files until lsphp restarts)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "killall lsphp 2>/dev/null; killall lsphp8.2 2>/dev/null; killall lsphp8.1 2>/dev/null; echo 'lsphp restarted'" \
            || true

          # ── Light-deploy guard ─────────────────────────────────────────────
          # The full script suite below (~45 wp-cli blocks) saturates the shared
          # host's PHP pool and 508s real visitors for the whole run.
          #
          # It used to run whenever ANY file under tools/ changed. That fired it
          # on every one-off task script — four photo-rotation deploys on
          # 2026-08-04 alone — even though the suite invokes a FIXED list of
          # scripts, so a brand-new one-off is not in it and re-running the other
          # 45 accomplishes nothing but a CPU spike.
          #
          # So the trigger is now precise: run the suite when a changed tools/
          # file is one this pipeline actually invokes (grep the workflow for
          # it), when the commit says [full-deploy], or when the range is unknown
          # (manual runs, force pushes). A one-off script still runs from the
          # step its own PR adds — that is unaffected by this decision.
          RUN_SUITE=1
          BEFORE="$GH_BEFORE"
          if [ "$GH_EVENT_NAME" = "push" ] \
             && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$GH_SHA" 2>/dev/null)
            MSGS=$(git log --format=%B "$BEFORE..$GH_SHA" 2>/dev/null)
            SUITE_TOOL_CHANGED=0
            for F in $(printf '%s\n' "$CHANGED" | grep '^tools/' || true); do
              if grep -q "$(basename "$F")" .github/workflows/deploy.yml 2>/dev/null; then
                SUITE_TOOL_CHANGED=1
                echo "Suite script changed: $F"
                break
              fi
            done
            # Artwork committed to the theme is the whole point of that folder:
            # the deploy rsyncs it to the server and the importer turns each
            # picture into a product. But a commit that adds ONLY images changes
            # no tools/ file and carries no [full-deploy], so the guard below
            # would skip the suite — the pictures would land on the server as
            # inert files and nothing would happen. That is the one case where
            # the artwork arrives and the section still looks empty, so it gets
            # its own trigger rather than depending on anyone remembering.
            ART_CHANGED=0
            if printf '%s\n' "$CHANGED" | grep -qiE '^assets/gold-foil/.+\.(jpe?g|png|webp|gif)$'; then
              ART_CHANGED=1
              echo "Gold-foil artwork added — running the full suite so it becomes products."
            fi
            if [ -n "$CHANGED" ] \
               && [ "$SUITE_TOOL_CHANGED" = "0" ] \
               && [ "$ART_CHANGED" = "0" ] \
               && ! printf '%s\n' "$MSGS" | grep -qi '\[full-deploy\]'; then
              RUN_SUITE=0
            fi
          fi
          # A diagnostics-only run overrides everything above: it is here to ask
          # the live database a question, not to change anything.
          if [ "$GH_DIAG_ONLY" = "true" ]; then
            RUN_SUITE=0
            echo "DIAGNOSTICS ONLY: theme deployed, every catalogue script skipped."
          elif [ "$RUN_SUITE" = "1" ]; then
            echo "FULL deploy: running the complete script suite."
          else
            echo "LIGHT deploy (theme code only): skipping the script suite. Put [full-deploy] in the commit message to force it."
          fi
          echo "RUN_SUITE=$RUN_SUITE" >> "$GITHUB_ENV"

      # Keep every Products-In-Motion card that CAN be local, local.
      # This maps reels in the Media Library to the row's videos — by video id
      # in the filename (what the owner's reel-fetch tool uploads), then by
      # title. It no longer tries to download from YouTube: that was attempted
      # from GitHub's runners and from the work container, and both are
      # datacenter addresses YouTube or policy refuses — three strikes,
      # measured, not assumed. Files reach the site from the owner's own
      # machine, which is the one address that works.
      # Fetch the row's reels onto the site, FROM the site.
      # YouTube refuses downloads from datacenter addresses - measured twice
      # from GitHub runners and once from the agent container. The one address
      # never tried is the web host itself, which does not look like CI. If it
      # is served, the whole thing is automatic and the owner does nothing.
      # If it is refused there too the script says so and exits 0; the row
      # keeps its chrome-free posters either way, so this can never break a
      # deploy.
      - name: Fetch the row's reels on the server
        if: always()
        timeout-minutes: 14
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             bash wp-content/themes/postero-child/tools/pim-fetch-on-server.sh 2>&1" \
            || true

      # Find a moving preview for each card. PHP through WordPress's HTTP
      # layer, because that is what demonstrably reaches the internet from
      # this host - the shell there cannot (curl to the site's own domain
      # timed out, and the yt-dlp fetch failed in a second).
      - name: Find a moving preview for each card
        if: always()
        timeout-minutes: 8
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/pim-anim-probe.php --allow-root 2>&1" \
            || true

      - name: Map the row's videos to local files
        if: always()
        timeout-minutes: 5
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          WEB="~/websites/OPu0sKi4J/public_html"
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ${WEB} && wp eval-file wp-content/themes/postero-child/tools/pim-local-video.php --allow-root 2>&1" \
            || true

      - name: Point the Gold Foiled & UV importer at a source
        if: inputs.goldfoil_source != ''
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
          GF_SOURCE: ${{ inputs.goldfoil_source }}
          GF_MAX: ${{ inputs.goldfoil_max }}
        run: |
          set -uo pipefail
          SSH="ssh -p ${H_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"

          # "auto" means put it back to the default: no stored source, so the
          # importer finds artwork on its own — the theme's assets/gold-foil/,
          # a folder or zip in uploads/, then new Media Library uploads. That is
          # the state to leave the site in, so that whichever way the artwork
          # eventually arrives, it just works.
          if [ "$GF_SOURCE" = "auto" ]; then
            echo "Clearing af_goldfoil_source (back to finding artwork on its own)..."
            ${SSH} -i ~/.ssh/id_ed25519 "${H_USER}@${H_HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp option delete af_goldfoil_source --allow-root 2>&1; \
               wp option get af_goldfoil_source --allow-root 2>&1 || echo '  (now unset)'" \
              || echo "  (could not clear it)"
          else
            # This value reaches a shell on the production server. It used to be
            # screened by a character whitelist, which quietly made the easiest
            # route impossible: a share link from Synology, Dropbox or Drive
            # almost always carries ? & and =, so the one thing the owner was
            # most likely to paste was the one thing the run rejected.
            #
            # So it is no longer screened by shape — it is carried as base64,
            # whose alphabet cannot end a quote or start a command, and decoded
            # on the far side. Any URL survives intact, and nothing in it can be
            # read as shell.
            case "$GF_SOURCE" in
              *[![:print:]]*) echo "::error::Refusing a source containing control characters."; exit 1 ;;
            esac
            if [ "${#GF_SOURCE}" -gt 2000 ]; then
              echo "::error::That source is ${#GF_SOURCE} characters — too long to be real."; exit 1
            fi
            GF_B64=$(printf '%s' "$GF_SOURCE" | base64 -w0)
            echo "Setting af_goldfoil_source to '${GF_SOURCE}'..."
            ${SSH} -i ~/.ssh/id_ed25519 "${H_USER}@${H_HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp option update af_goldfoil_source \"\$(printf %s '${GF_B64}' | base64 -d)\" --allow-root 2>&1" \
              || echo "  (could not set it — the import below will use whatever is already stored)"
          fi

          if [ -n "${GF_MAX}" ]; then
            case "$GF_MAX" in
              ''|*[!0-9]*) echo "::error::goldfoil_max must be a whole number, got '$GF_MAX'"; exit 1 ;;
            esac
            echo "Capping this run at ${GF_MAX} new product(s)..."
            ${SSH} -i ~/.ssh/id_ed25519 "${H_USER}@${H_HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp option update af_goldfoil_max '${GF_MAX}' --allow-root 2>&1" \
              || echo "  (could not set the cap — the stored one still applies)"
          fi

      - name: Point the folder watcher at a link, and sync now
        if: inputs.goldfoil_watch_url != '' || inputs.goldfoil_sync_now
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
          GF_WATCH: ${{ inputs.goldfoil_watch_url }}
          GF_NOW: ${{ inputs.goldfoil_sync_now }}
        run: |
          set -uo pipefail
          SSH="ssh -p ${H_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          if [ -n "${GF_WATCH}" ]; then
            # base64 so a share link's ? & and = cannot be read as shell
            W=$(printf '%s' "$GF_WATCH" | base64 -w0)
            echo "Watching: ${GF_WATCH}"
            ${SSH} -i ~/.ssh/id_ed25519 "${H_USER}@${H_HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp option update af_goldfoil_watch_url \"\$(printf %s '${W}' | base64 -d)\" --allow-root 2>&1 && \
               wp option delete af_goldfoil_watch_hash --allow-root 2>&1 || true" \
              || echo "  (could not set the watch link)"
          fi
          if [ "${GF_NOW}" = "true" ] || [ -n "${GF_WATCH}" ]; then
            echo "Fetching from the watched folder now..."
            ${SSH} -i ~/.ssh/id_ed25519 "${H_USER}@${H_HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp eval 'echo af_goldfoil_sync_run(true) . \"\\n\";' --allow-root 2>&1" \
              || echo "  (sync failed — see the message above)"
          fi

      - name: Remove Gold Foiled & UV pieces copied from existing products
        if: inputs.goldfoil_remove_copies
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          set -uo pipefail
          SSH="ssh -p ${H_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "Removing the copied pieces (artwork imported from real files is left alone)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${H_USER}@${H_HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/remove-goldfoil-copies.php --allow-root 2>&1" \
            || echo "  (removal step failed — nothing was changed)"

      - name: Script suite 1 — catalogue & content
        if: env.RUN_SUITE == '1'
        timeout-minutes: 15
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"

          # Gold Foiled & UV runs FIRST: the importer creates this suite's only
          # brand-new products, and every pass below (template, filterable
          # attributes, tags, MRP markup, SEO meta, category thumbs) sweeps all
          # published products — so a product born here leaves this deploy with
          # the same details as the rest of the catalogue instead of waiting a
          # deploy for them.
          echo "Setting up the Gold Foiled & UV section..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/setup-gold-foil.php --allow-root 2>&1" \
            || true

          # Reads, in order: the theme's assets/gold-foil/, a folder or zip in
          # uploads/ (gold-foil / Personalised), then Media Library uploads
          # newer than the section that nothing uses yet — so a folder dragged
          # into Media -> Add New becomes products with no other step.
          echo "Importing Gold Foiled & UV artwork (skips anything already imported)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/import-gold-foil.php --allow-root 2>&1" \
            || true

          echo "Applying product template to ALL canvas products..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/apply-template.php --allow-root 2>&1" \
            || true

          echo "Assigning filterable size/color/frame attributes..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/assign-filter-attributes.php --allow-root 2>&1" \
            || true

          echo "Assigning product tags (for tag filter)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/assign-tags.php --allow-root 2>&1" \
            || true

          echo "Stripping in-content FAQ (now rendered via styled hook)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/dedup-faq.php --allow-root 2>&1" \
            || true

          echo "Switching storefront currencies to USD + CAD..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/switch-currency-cad.php --allow-root 2>&1" \
            || true

          echo "Creating missing legal/utility pages..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/create-pages.php --allow-root 2>&1" \
            || true

          echo "Ensuring the visitor activity-log table exists..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/create-activity-log-table.php --allow-root 2>&1" \
            || true

          echo "Fixing Elementor footer links..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-footer-links.php --allow-root 2>&1" \
            || true

          echo "Setting up granular admin roles..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}"             "cd ~/websites/OPu0sKi4J/public_html &&              wp eval-file wp-content/themes/postero-child/tools/setup-admin-roles.php --allow-root 2>&1"             || true

          echo "Gift card product + My Account endpoints..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}"             "cd ~/websites/OPu0sKi4J/public_html &&              wp eval-file wp-content/themes/postero-child/tools/setup-giftcards-endpoints.php --allow-root 2>&1"             || true

          echo "Applying styled content to spec pages..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/restyle-pages.php --allow-root 2>&1" \
            || true

          echo "Repairing product SEO meta (titles, descriptions, focus keywords)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-product-seo-meta.php --allow-root 2>&1" \
            || true

