      # LAST, deliberately: a deploy is the only window onto the live database
      # and it costs fifteen minutes, so this asks in one pass everything needed
      # to decide where the section's products come from — and being the final
      # step, its answer is the last thing the log says instead of being buried.
      - name: What could populate Gold Foiled & UV (read-only)
        if: always()
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "What is already on the site that the section could be built from..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-goldfoil-populate.php --allow-root 2>&1" \
            || true

