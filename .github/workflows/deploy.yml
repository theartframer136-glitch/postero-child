      - name: Gates & warm (always)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"

          echo "The shop must not be hidden behind a placeholder..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-coming-soon.php --allow-root 2>&1" \
            || true

          echo "Site visibility + product-page health..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-site-visibility.php --allow-root 2>&1" \
            || true

          echo "GATE: the theme must actually boot..."
          BOOT=$(${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && wp eval 'echo \"AF_BOOT_OK\";' --allow-root 2>&1")
          echo "$BOOT"
          if echo "$BOOT" | grep -qi "Fatal error\|critical error"; then
            echo "::error::The theme fatals on load — the site is down. See the error above."
            exit 1
          fi
          if ! echo "$BOOT" | grep -q "AF_BOOT_OK"; then
            echo "::error::WordPress could not bootstrap with this theme."
            exit 1
          fi

          echo "GATE: the site must serve 200..."
          # The pipeline itself just fired ~25 WP-CLI processes at the shared
          # host, so the first probe can catch a momentary 508. Distinguish
          # "still catching its breath" from "actually down" by retrying
          # briefly before failing the deploy.
          CODE=000
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -A 'Mozilla/5.0 (X11; Linux x86_64) AF-DeployGate' https://theartframer.us/ || echo 000)
            echo "homepage HTTP $CODE (attempt $i)"
            case "$CODE" in 200|301|302) break ;; esac
            sleep 15
          done
          case "$CODE" in
            200|301|302) : ;;
            *) echo "::error::Homepage still returned $CODE after 5 attempts over ~1 minute."; exit 1 ;;
          esac

          # A 200 is not proof the shop is open. WooCommerce's coming-soon mode
          # and maintenance screens answer 200 with a placeholder, so a
          # status-only gate would wave through a storefront that shows
          # visitors nothing they can buy. Check the body says shop.
          echo "GATE: the homepage must be the real shop, not a placeholder..."
          # Written to a file, never piped: with `set -o pipefail`, `grep -q`
          # exits on first match and kills printf with SIGPIPE, so the pipeline
          # reports 141 and the test inverts. That bug failed run #31098282890
          # against a perfectly healthy homepage.
          curl -s --max-time 45 -A 'Mozilla/5.0 (X11; Linux x86_64) AF-DeployGate' \
            https://theartframer.us/ -o /tmp/af-home.html || true
          HOME_TITLE=$(grep -oiE '<title>[^<]*</title>' /tmp/af-home.html | head -1)
          echo "homepage title: ${HOME_TITLE:-(none)}"
          # a placeholder announces itself in the TITLE; the word "coming soon"
          # appearing somewhere in a 140 KB storefront means nothing
          if printf '%s' "$HOME_TITLE" | grep -qi 'coming soon'; then
            echo "::error::Homepage is serving a COMING SOON placeholder — the shop is hidden from customers."
            exit 1
          fi
          if ! grep -qiE 'add-to-cart|woocommerce|product' /tmp/af-home.html; then
            echo "::error::Homepage returned 200 but contains no storefront markup."
            exit 1
          fi
          echo "homepage is the real storefront"

          echo "Re-warming page cache (the mid-pipeline purge left every page cold — without this, real visitors pay the cold-render cost and hit 508s while the host is still busy)..."
          # Sequential, one request at a time, so warming itself never adds
          # concurrent-PHP pressure. Warms the default (anonymous desktop)
          # cache variant — the one first-time visitors get.
          # The warm list comes from WordPress itself, not from scraping the
          # sitemap over HTTP. Run #544 proved why: the sitemap parse silently
          # yielded nothing and the deploy reported "Warmed 1 pages" — so after
          # purging the ENTIRE cache we left 394 products and every category and
          # tag archive cold, and the next crawler to touch each one paid a full
          # ~2-3s render. That is what makes CPU spike after a deploy and settle
          # again hours later. wp-cli cannot silently return the wrong thing here:
          # if it yields nothing, the guard below fails the deploy loudly.
          # The warm is sized to the deploy: a full suite touched catalogue
          # data, so categories and recent products get warmed; a light deploy
          # changed theme code only, so the entrance pages are enough and the
          # rest re-warms organically. This is most of the difference between a
          # ~10-minute and a ~3-minute deploy.
          if [ "${RUN_SUITE:-1}" = "1" ]; then CATN=12; PRODN=8; WARM_CAP=24; else CATN=5; PRODN=0; WARM_CAP=10; fi
          WARM_LIST=/tmp/warm-urls.txt
          {
            echo "https://theartframer.us/"
            echo "https://theartframer.us/shop/"
            echo "https://theartframer.us/try-on-wall/"
            echo "https://theartframer.us/frame-the-moment/"
            ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp term list product_cat --field=url --hide_empty=1 --number=${CATN} --orderby=count --order=DESC --allow-root 2>/dev/null; \
               if [ ${PRODN} -gt 0 ]; then wp post list --post_type=product --post_status=publish --field=url \
                 --posts_per_page=${PRODN} --orderby=modified --order=DESC --allow-root 2>/dev/null; fi" || true
          } | tr -d '\r' | grep '^https\?://' | awk '!seen[$0]++' > "$WARM_LIST"

          WARM_TOTAL=$(wc -l < "$WARM_LIST")
          echo "Warm list: $WARM_TOTAL URLs (categories first, then recently-changed products)."
          if [ "$WARM_TOTAL" -lt 3 ]; then
            echo "::error::Could not build a warm list — the cache would be left cold after the purge, which spikes CPU. Failing so this is never silent again."
            exit 1
          fi

          WARMED=0
          MISSED=0
          while read -r URL; do
            [ $WARMED -ge $WARM_CAP ] && break
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -A 'Mozilla/5.0 (X11; Linux x86_64) AF-CacheWarmer' "$URL" || echo 000)
            case "$CODE" in 200|301|302) : ;; *) MISSED=$((MISSED + 1)); echo "  warmed $URL -> $CODE" ;; esac
            WARMED=$((WARMED + 1))
            sleep 1
          done < "$WARM_LIST"
          echo "Warmed $WARMED pages ($MISSED non-2xx)."
          # Warming is what stops the post-deploy spike, so a wholesale failure
          # must not pass silently either.
          if [ "$WARMED" -gt 0 ] && [ "$MISSED" -ge "$WARMED" ]; then
            echo "::error::Every warm request failed — the cache is cold and CPU will spike."
            exit 1
          fi

          echo "Deploy complete"
