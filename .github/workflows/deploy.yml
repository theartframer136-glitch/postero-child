          # Teed to a file for the same reason the apply report is: this is the
          # only current picture of which product holds which code, and working
          # from a stale copy of it has already produced rows whose stated reason
          # named a code the product no longer had.
          echo "Which products share an art code (read-only)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
