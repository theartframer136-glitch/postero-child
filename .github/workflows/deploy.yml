      - name: Gates & warm (always)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"

          echo "GATE: the theme must actually boot..."
          BOOT=$(${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && wp eval 'echo \"AF_BOOT_OK\";' --allow-root 2>&1")
          echo "$BOOT"
          if echo "$BOOT" | grep -qi "Fatal error\|critical error"; then
            echo "::error::The theme fatals on load — the site is down. See the error above."
            exit 1
          fi
          if ! echo "$BOOT" | grep -q "AF_BOOT_OK"; then
            echo "::error::WordPress could not bootstrap with this theme."
            exit 1
          fi

          echo "GATE: the site must serve 200..."
          # The pipeline itself just fired ~25 WP-CLI processes at the shared
          # host, so the first probe can catch a momentary 508. Distinguish
          # "still catching its breath" from "actually down" by retrying
          # briefly before failing the deploy.
          CODE=000
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -A 'Mozilla/5.0 (X11; Linux x86_64) AF-DeployGate' https://theartframer.us/ || echo 000)
            echo "homepage HTTP $CODE (attempt $i)"
            case "$CODE" in 200|301|302) break ;; esac
            sleep 15
          done
          case "$CODE" in
            200|301|302) : ;;
            *) echo "::error::Homepage still returned $CODE after 5 attempts over ~1 minute."; exit 1 ;;
          esac

          echo "Re-warming page cache (the mid-pipeline purge left every page cold — without this, real visitors pay the cold-render cost and hit 508s while the host is still busy)..."
          # Sequential, one request at a time, so warming itself never adds
          # concurrent-PHP pressure. Warms the default (anonymous desktop)
          # cache variant — the one first-time visitors get.
          WARM_LIST=/tmp/warm-urls.txt
          echo "https://theartframer.us/" > "$WARM_LIST"
          for SITEMAP in "https://theartframer.us/sitemap_index.xml" "https://theartframer.us/wp-sitemap.xml"; do
            SUBMAPS=$(curl -s --max-time 30 "$SITEMAP" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep -i 'product_cat\|product-cat\|category\|page' | head -4)
            [ -n "$SUBMAPS" ] || continue
            for SM in $SUBMAPS; do
              curl -s --max-time 30 "$SM" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' >> "$WARM_LIST"
            done
            break
          done
          WARMED=0
          while read -r URL; do
            [ $WARMED -ge 30 ] && break
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -A 'Mozilla/5.0 (X11; Linux x86_64) AF-CacheWarmer' "$URL" || echo 000)
            echo "  warmed $URL -> $CODE"
            WARMED=$((WARMED + 1))
            sleep 2
          done < <(
            # Homepage first, then category archives (the money pages — their
            # sitemap sits last in the index and got crowded out by the page
            # list before this reorder), then everything else, deduped.
            { head -1 "$WARM_LIST"; grep '/product-category/' "$WARM_LIST"; tail -n +2 "$WARM_LIST" | grep -v '/product-category/'; } | awk '!seen[$0]++'
          )
          echo "Warmed $WARMED pages."

          echo "Deploy complete"
