          # ── always run: boot gate, 200 gate, cache warm ──

      # The section is only right while something keeps putting the invariant
      # back, and the pass that does it sits in the suite above. Most deploys
      # are light, so on those nothing files a premium piece into its own
      # section: deploy 887 found 37 pieces carrying the flag and none in the
      # section, so the page answered "No products were found" while the same
      # artwork sat in All Art Prints and Personalised Prints instead.
      #
      # So run the enforcer on light deploys too, for the reason the image pass
      # below stopped being gated. It is idempotent and says what it changed,
      # so on a catalogue that is already correct it costs one WP-CLI call and
      # prints "nothing to correct". Full deploys keep using the copy inside
      # the suite, which runs at the one point that matters there: straight
      # after the sweeps that append a category to every product. The
      # sub-collection grouping stays full-deploy only — it creates terms,
      # where this only moves a piece back inside a boundary that already
      # exists.
      - name: Keep Gold Foiled & UV in its own section (light deploys)
        if: env.RUN_SUITE != '1'
        timeout-minutes: 8
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "Keeping Gold Foiled & UV in its own section..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/enforce-goldfoil-category.php --allow-root 2>&1" \
            || true

      # Rebuild the resized copies of product images so the quality and width
      # this theme asks for actually reach the catalogue that already exists.
      # Neither setting is retroactive — WordPress encodes the copies once, at
      # upload — so without this the filters are shipped and invisible.
      #
      # Bounded on purpose. This host has returned 508 under deploy load, and
      # re-encoding the whole library in one pass is the most expensive thing
      # here. Each run takes a slice, records what it finished, and resumes
      # next deploy; the timeout is a backstop well above the script's own
      # budget so a slow host shows up as a short run, not a killed step.
      # Runs on EVERY deploy, not just full ones. It used to be gated behind
      # RUN_SUITE, and most deploys are light — so the pass that makes the
      # image settings real was skipped on most of them and the catalogue
      # crawled. It costs one query once the catalogue is done, so leaving it
      # on permanently is close to free.
      - name: Rebuild product image sizes (batched, resumable)
        if: always()
        timeout-minutes: 10
        env:
          AF_IMG_SECONDS: '240'
          AF_IMG_MAX: '400'
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "Rebuilding product image sizes..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             AF_IMG_SECONDS=${AF_IMG_SECONDS} AF_IMG_MAX=${AF_IMG_MAX} \
             wp eval-file wp-content/themes/postero-child/tools/regenerate-image-sizes.php --allow-root 2>&1" \
            || true

      - name: Apply the checked art-code corrections
        if: always()
        timeout-minutes: 8
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "Write the art codes that were checked against the book..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             AF_APPLY=1 \
             wp eval-file wp-content/themes/postero-child/tools/apply-artcode-corrections.php --allow-root 2>&1" \
            2>&1 | tee /tmp/af-apply.txt || true
          # Also kept as a file, because this is the one output that says what
          # actually reached the database and the log cannot be relied on to
          # still be holding it by the time anyone reads it — twenty verbose
          # read-only checks run after this one. The publish step carries it out
          # on the art-sheets branch next to the pictures.

      # The brochure now prints each section's number alongside the page's --
      # RK 01 is RK - 0101 -- and it closed the two gaps its old numbering had,
      # so TP 05 and everything after it, and HD 15 and everything after it,
      # move down one. Every product carries the code the book prints, so every
      # product's code is restated here.
      #
      # Placed between the two steps it sits between for a reason. It runs after
      # the corrections pass, so a code that pass has just fixed is renumbered in
      # the same deploy rather than the next one; and before the SKU pass, which
      # builds each SKU from the code and must see the new one. Both of those
      # passes read the book's numbering themselves, so the order is a
      # convenience and not something correctness hangs on.
      #
      # A code naming no page of the book is left exactly as it is and listed in
      # the report -- deciding what such a product should carry means putting its
      # picture next to the book, which is the audit's work and not this pass's.
      - name: Put the art codes into the book's numbering
        if: always()
        timeout-minutes: 8
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "Restating every art code in the numbering the book prints now..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             AF_APPLY=1 \
             wp eval-file wp-content/themes/postero-child/tools/renumber-artcodes.php --allow-root 2>&1" \
            2>&1 | tee /tmp/af-renumber.txt || true
          # Kept as a file as well, for the reason APPLIED.txt is: this is the
          # other output that says what actually reached the database, and the
          # log cannot be relied on to still hold it by the time anyone reads
          # it. The publish step carries it out on the art-sheets branch.

      - name: SKU → art code (batched, resumable)
        if: always()
        timeout-minutes: 8
        env:
          AF_SKU_SECONDS: '200'
          AF_SKU_MAX: '800'
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          echo "Setting product SKUs from their art codes..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             AF_SKU_SECONDS=${AF_SKU_SECONDS} AF_SKU_MAX=${AF_SKU_MAX} \
