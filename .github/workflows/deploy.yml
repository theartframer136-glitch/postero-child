name: Deploy Theme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One deploy at a time. Two overlapping runs each rsync --delete the theme and
# fire a dozen WP-CLI processes at the same shared host, which is enough to hit
# Hostinger's resource limit and take the site to HTTP 508 while they run.
# Queue instead of cancelling: every pushed commit still gets deployed.
# (Run #518 was rejected at startup with the run name falling back to the file
# path — the invalid-workflow signature — yet actionlint and every YAML parser
# accept this file. This commit is the empirical retest of the same content.)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the light-deploy guard can diff the pushed range
          fetch-depth: 0

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy (rsync + opcache + mode decision)
        timeout-minutes: 30
        # All ${{ }} live here, NOT in the run block: a run block containing
        # any expression is compiled as one template capped at 21000 chars,
        # and this script is far past that.
        env:
          H_USER: ${{ secrets.HOSTINGER_USERNAME }}
          H_HOST: ${{ secrets.HOSTINGER_HOST }}
          H_PORT: ${{ secrets.HOSTINGER_PORT }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BEFORE: ${{ github.event.before }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          USER="$H_USER"
          HOST="$H_HOST"
          PORT="$H_PORT"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"
          echo "Deploying to: ${TARGET}"

          echo "EMERGENCY: clearing any stuck WordPress maintenance-mode flag..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html 2>/dev/null && rm -f .maintenance && (wp maintenance-mode deactivate --allow-root 2>&1 || true)" \
            || echo "  (early clear skipped — will retry via recover-maintenance.php after rsync)"

          # ControlMaster multiplexing (the -o Control* options on every SSH
          # var in this file) makes the whole deploy share ONE ssh connection
          # instead of opening 10+ — Hostinger's throttle counts connections,
          # and that spree is what starved runs #526/527/534. Connection reuse
          # is what actually tamed the throttle, so the pre-wait is a short
          # grace, and the rsync retry ladder below remains the safety net.
          echo "Waiting 20s for any SSH throttle to clear..."
          sleep 20

          MAX=6
          DELAY=90
          DEPLOYED=0
          for i in $(seq 1 $MAX); do
            echo "Attempt $i of $MAX..."
            if rsync -avz --delete \
              --exclude ".git" \
              --exclude ".github" \
              --exclude "node_modules" \
              -e "${SSH} -i ~/.ssh/id_ed25519" \
              ./ \
              "${USER}@${HOST}:${TARGET}/"; then
              DEPLOYED=1
              break
            fi
            if [ $i -eq $MAX ]; then
              echo "All $MAX attempts failed."
              exit 1
            fi
            echo "Throttled — waiting ${DELAY}s before retry..."
            sleep $DELAY
            DELAY=$((DELAY + 90))
          done

          echo "Restarting PHP workers (opcache holds modified files until lsphp restarts)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "killall lsphp 2>/dev/null; killall lsphp8.2 2>/dev/null; killall lsphp8.1 2>/dev/null; echo 'lsphp restarted'" \
            || true

          # ── Light-deploy guard ─────────────────────────────────────────────
          # The full script suite below (~45 wp-cli blocks) saturates the shared
          # host's PHP pool and 508s real visitors for the whole run.
          #
          # It used to run whenever ANY file under tools/ changed. That fired it
          # on every one-off task script — four photo-rotation deploys on
          # 2026-08-04 alone — even though the suite invokes a FIXED list of
          # scripts, so a brand-new one-off is not in it and re-running the other
          # 45 accomplishes nothing but a CPU spike.
          #
          # So the trigger is now precise: run the suite when a changed tools/
          # file is one this pipeline actually invokes (grep the workflow for
          # it), when the commit says [full-deploy], or when the range is unknown
          # (manual runs, force pushes). A one-off script still runs from the
          # step its own PR adds — that is unaffected by this decision.
          RUN_SUITE=1
          BEFORE="$GH_BEFORE"
          if [ "$GH_EVENT_NAME" = "push" ] \
             && [ -n "$BEFORE" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "$GH_SHA" 2>/dev/null)
            MSGS=$(git log --format=%B "$BEFORE..$GH_SHA" 2>/dev/null)
            SUITE_TOOL_CHANGED=0
            for F in $(printf '%s\n' "$CHANGED" | grep '^tools/' || true); do
              if grep -q "$(basename "$F")" .github/workflows/deploy.yml 2>/dev/null; then
                SUITE_TOOL_CHANGED=1
                echo "Suite script changed: $F"
                break
              fi
            done
            if [ -n "$CHANGED" ] \
               && [ "$SUITE_TOOL_CHANGED" = "0" ] \
               && ! printf '%s\n' "$MSGS" | grep -qi '\[full-deploy\]'; then
              RUN_SUITE=0
            fi
          fi
          if [ "$RUN_SUITE" = "1" ]; then
            echo "FULL deploy: running the complete script suite."
          else
            echo "LIGHT deploy (theme code only): skipping the script suite. Put [full-deploy] in the commit message to force it."
          fi
          echo "RUN_SUITE=$RUN_SUITE" >> "$GITHUB_ENV"

      - name: Script suite 1 — catalogue & content
        if: env.RUN_SUITE == '1'
        timeout-minutes: 15
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"

          echo "Applying product template to ALL canvas products..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/apply-template.php --allow-root 2>&1" \
            || true

          echo "Assigning filterable size/color/frame attributes..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/assign-filter-attributes.php --allow-root 2>&1" \
            || true

          echo "Assigning product tags (for tag filter)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/assign-tags.php --allow-root 2>&1" \
            || true

          echo "Stripping in-content FAQ (now rendered via styled hook)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/dedup-faq.php --allow-root 2>&1" \
            || true

          echo "Switching storefront currencies to USD + CAD..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/switch-currency-cad.php --allow-root 2>&1" \
            || true

          echo "Creating missing legal/utility pages..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/create-pages.php --allow-root 2>&1" \
            || true

          echo "Ensuring the visitor activity-log table exists..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/create-activity-log-table.php --allow-root 2>&1" \
            || true

          echo "Fixing Elementor footer links..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-footer-links.php --allow-root 2>&1" \
            || true

          echo "Setting up granular admin roles..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}"             "cd ~/websites/OPu0sKi4J/public_html &&              wp eval-file wp-content/themes/postero-child/tools/setup-admin-roles.php --allow-root 2>&1"             || true

          echo "Gift card product + My Account endpoints..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}"             "cd ~/websites/OPu0sKi4J/public_html &&              wp eval-file wp-content/themes/postero-child/tools/setup-giftcards-endpoints.php --allow-root 2>&1"             || true

          echo "Applying styled content to spec pages..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/restyle-pages.php --allow-root 2>&1" \
            || true

          echo "Repairing product SEO meta (titles, descriptions, focus keywords)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-product-seo-meta.php --allow-root 2>&1" \
            || true

          echo "Optimizing assets via LiteSpeed (safe pass)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/optimize-assets.php --allow-root 2>&1" \
            || true

          echo "Applying business address / GSC token (no-op until supplied)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/set-business-address.php --allow-root 2>&1" \
            || true

          echo "Enabling product reviews store-wide..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/enable-reviews.php --allow-root 2>&1" \
            || true

          echo "Applying SEO improvements (meta, robots.txt, alt text)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/seo-improvements.php --allow-root 2>&1" \
            || true

          echo "Fixing missing product featured images..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-featured-images.php --allow-root 2>&1" \
            || true

          echo "Correcting sideways/rotated product images (EXIF orientation)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-image-orientation.php --allow-root 2>&1" \
            || true

          echo "Flipping RK 18 (Radha Krishna Mosaic Art) photo 180 deg (requested again)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/flip-rk18-image-180-again.php --allow-root 2>&1" \
            || true

          echo "Rotating Radha Krishna Jeweled Duet photo 90 deg anti-clockwise..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/rotate-radha-krishna-jeweled-duet-ccw90.php --allow-root 2>&1" \
            || true

          echo "Correcting Radha Krishna Jeweled Duet rotation target: revert featured image, rotate 2nd gallery photo instead..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-radha-krishna-jeweled-duet-target.php --allow-root 2>&1" \
            || true

          echo "Rotating both Radha Krishna Graphite Duet photos 90 deg anti-clockwise..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/rotate-radha-krishna-graphite-duet-ccw90.php --allow-root 2>&1" \
            || true

          echo "Rotating 2nd gallery photo of Moonlit Lotus Radha (TA 04) 90 deg anti-clockwise..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/rotate-moonlit-lotus-radha-gallery2-ccw90.php --allow-root 2>&1" \
            || true

          echo "Rotating Colorful Horses (SH 06) photo 90 deg clockwise..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/rotate-colorful-horses-cw90.php --allow-root 2>&1" \
            || true

          echo "Rotating 2nd gallery photo of Ganesha Dawn Silhouette (LS 11) 90 deg anti-clockwise..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/rotate-ganesha-dawn-silhouette-gallery2-ccw90.php --allow-root 2>&1" \
            || true

          echo "Checking for gallery photos that belong to a different product (read-only)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-gallery-featured-mismatch.php --allow-root 2>&1" \
            || true

          echo "Checking for product images served below their originally uploaded quality (read-only)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-image-quality-scan.php --allow-root 2>&1" \
            || true

          echo "Checking inventory-tool allowlist resolves to real accounts (read-only)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-inventory-access.php --allow-root 2>&1" \
            || true

          echo "Art Code report: current codes vs image-filename codes, by category (read-only)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-artcode-report.php --allow-root 2>&1" \
            || true

          echo "Restoring the 4 images found downscaled below their original quality..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/restore-original-image-quality.php --allow-root 2>&1" \
            || true

          echo "Removing duplicate product categories..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/dedupe-categories.php --allow-root 2>&1" \
            || true

          echo "Drafting imageless products (removes blank cards)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/draft-imageless.php --allow-root 2>&1" \
            || true

          echo "Enabling digital downloads (payment-gated files)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/enable-digital-downloads.php --allow-root 2>&1" \
            || true

          echo "Restoring original theme About page (one-time)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/restore-about.php --allow-root 2>&1" \
            || true

          echo "Filling empty product galleries (fixes hover 'Gallery image not present')..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fill-gallery-images.php --allow-root 2>&1" \
            || true

          echo "Applying real Art Framer content to theme About page..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/about-real-content.php --allow-root 2>&1" \
            || true

          echo "Stripping broken images from product descriptions..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fix-broken-content.php --allow-root 2>&1" \
            || true

          echo "Filling missing subcategory thumbnails..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/fill-category-thumbs.php --allow-root 2>&1" \
            || true

          echo "Assigning products to deity subcategories..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/assign-deity-categories.php --allow-root 2>&1" \
            || true

          # ── always run: LiteSpeed safety enforcement, recovery, headers ──

      - name: Safety enforcement (always)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          USER="${{ secrets.HOSTINGER_USERNAME }}"
          HOST="${{ secrets.HOSTINGER_HOST }}"
          PORT="${{ secrets.HOSTINGER_PORT }}"
          THEME="postero-child"
          SSH="ssh -p ${PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ControlMaster=auto -o ControlPath=/tmp/sshcm-%r-%p -o ControlPersist=600"
          TARGET="websites/OPu0sKi4J/public_html/wp-content/themes/${THEME}"

          echo "Disabling LiteSpeed image lazy-load + JS defer/combine (keep Instagram embed + products visible)..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp litespeed-option set media-lazy false --allow-root 2>&1; \
             wp litespeed-option set media-iframe_lazy false --allow-root 2>&1; \
             wp litespeed-option set optm-js_defer 0 --allow-root 2>&1; \
             wp litespeed-option set optm-js_comb false --allow-root 2>&1; \
             wp litespeed-option get media-lazy --allow-root 2>&1" \
            || true

          echo "Dropping tracker query params from the cache key (ad-click URLs share one cache entry instead of each being a full-render MISS)..."
          # Purge ONLY when the value actually changed. This setting is stable
          # across deploys, so the unconditional purge that used to sit here
          # emptied the whole page cache on every run for no reason — and a cold
          # cache is exactly what makes CPU spike afterwards.
          QSOUT=$(${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp option update litespeed.conf.cache-drop_qs --format=json '[\"fbclid\",\"gclid\",\"gbraid\",\"wbraid\",\"msclkid\",\"ttclid\",\"igshid\",\"mc_cid\",\"mc_eid\",\"utm_source\",\"utm_medium\",\"utm_campaign\",\"utm_term\",\"utm_content\",\"utm_id\"]' --allow-root 2>&1") \
            || true
          printf '%s\n' "$QSOUT"
          if printf '%s' "$QSOUT" | grep -qi 'unchanged'; then
            echo "  drop_qs already correct — skipping the purge."
          else
            echo "  drop_qs changed — purging so the new cache key takes effect."
            ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && wp litespeed-purge all --allow-root 2>/dev/null || true" || true
          fi

          echo "Recovery: clear maintenance flag + disable blanket auto-updates..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/recover-maintenance.php --allow-root 2>&1" \
            || true

          echo "Writing security headers into docroot .htaccess..."
          ${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/set-security-headers.php --allow-root 2>&1" \
            || true

          echo "Crawl guard: spam-URL 410s, headerless-search 403s, cheap static 404s (the CPU fix)..."
          # Unlike the other scripts, a silent failure here means the CPU fix
          # is NOT live while the deploy shows green. Run #526 proved grepping
          # for the FAIL marker is not enough: Hostinger's SSH throttle refused
          # the connection outright, GUARD_OUT held only an ssh error, and the
          # step passed. So also require the script's own completion marker,
          # retrying across the throttle window before failing the deploy.
          GUARD_OK=0
          for a in 1 2 3; do
            GUARD_OUT=$(${SSH} -i ~/.ssh/id_ed25519 "${USER}@${HOST}" \
              "cd ~/websites/OPu0sKi4J/public_html && \
               wp eval-file wp-content/themes/postero-child/ops/harden-crawl-budget.php --allow-root 2>&1") \
              || true
            printf '%s\n' "$GUARD_OUT"
            if printf '%s' "$GUARD_OUT" | grep -q "AF-GUARD-FAIL:"; then
              echo "::error::Crawl guard did not apply cleanly — see the AF-GUARD-FAIL line above."
              exit 1
            fi
            if printf '%s' "$GUARD_OUT" | grep -q "=== DONE ==="; then
              GUARD_OK=1
              break
            fi
            echo "Crawl guard did not run to completion (attempt $a of 3) — likely SSH throttle; waiting 75s..."
            sleep 75
          done
          if [ "$GUARD_OK" != "1" ]; then
            echo "::error::Crawl guard never ran to completion after 3 attempts — the CPU fix is NOT live."
            exit 1
          fi
          if printf '%s' "$GUARD_OUT" | grep -q "AF-GUARD-WARN:"; then
            echo "::warning::Crawl guard applied with a caveat — see the AF-GUARD-WARN line above."
          fi

          # External search gate: THIS runner provably reaches the site through
          # the CDN, unlike the installer's origin-side probe. If a browser-
          # headed search trips the guard's own marker, Sec-Fetch headers are
          # being eaten in transit — strip the search rule (persisted) so
          # customer search can never break, then prove it clear.
          echo "GATE: browser-headed search through the CDN must not trip the guard..."
          SGATE=$(curl -s -D - -o /dev/null --max-time 45 \
