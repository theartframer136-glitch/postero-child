      # scrolls? Server-side checks can only prove the code is served; this
      # opens the live page in Chrome on the runner, scrolls it, and reports
      # PINNED or the exact ancestor blocking it. Read-only.
      - name: Headless sticky-gallery check (read-only)
        timeout-minutes: 6
        run: |
          set -uo pipefail
