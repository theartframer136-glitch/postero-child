name: Protect Images
# Refuse direct-URL and hotlink access to the pictures, at the web server,
# without touching how pages render or how Inspect works.
# Run with dry_run first: it reports the server state and the exact rules it
# would write, and changes nothing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only — show the server state and the rules, write nothing
        type: boolean
        default: true
      revert:
        description: Remove the protection instead of applying it
        type: boolean
        default: false

jobs:
  protect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Send the script up
        run: |
          set -uo pipefail
          scp -P "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              tools/protect-images.php \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:~/websites/OPu0sKi4J/public_html/wp-content/themes/postero-child/tools/protect-images.php" \
            || echo "  scp failed — falling back to whatever the last deploy left there"

      - name: Apply
        timeout-minutes: 12
        run: |
          set -uo pipefail
          ssh -p "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             DRY=${{ inputs.dry_run && '1' || '' }} \
             REVERT=${{ inputs.revert && '1' || '' }} \
             wp eval-file wp-content/themes/postero-child/tools/protect-images.php --allow-root 2>&1" \
            || true
