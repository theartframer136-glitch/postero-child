name: Check Wishlist Card
# Print what a "You may also like" card actually renders, so the missing rows
# are diagnosed from the markup rather than guessed at.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Send the script up
        run: |
          set -uo pipefail
          scp -P "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              tools/diag-wl-card.php \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:~/websites/OPu0sKi4J/public_html/wp-content/themes/postero-child/tools/diag-wl-card.php" \
            || echo "  scp failed"
      - name: Inspect
        timeout-minutes: 12
        run: |
          set -uo pipefail
          ssh -p "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             wp eval-file wp-content/themes/postero-child/tools/diag-wl-card.php --allow-root 2>&1" \
            || true
