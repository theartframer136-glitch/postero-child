name: Check Cart Upgrade
# Read-only (a fresh guest basket, no order placed): clicks each "Your choices"
# button on the live cart and checks the line prices, details, layout and
# subtotal after the cart redraws.
on:
  workflow_dispatch:
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -uo pipefail
          npm install --no-fund --no-audit --prefix /tmp/afh puppeteer-core@22 > /dev/null 2>&1 || true
          NODE_PATH=/tmp/afh/node_modules node tools/diag-cart-upgrade.mjs || true
