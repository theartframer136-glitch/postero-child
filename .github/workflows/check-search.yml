name: Check Search

# Does searching an art code find the piece?
#
# The owner recorded "RK - 0118" returning "Nothing Found" on 2026-09-09. This
# asks the live site the same question in the same way, in about a minute, and
# in several spellings — because a fix that only works when the code is typed
# with the exact spacing shown on the card is not a fix.
#
# Read-only: it fetches search pages. Nothing is written and no SSH is used.

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Search the live site for art codes
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          # Codes seen on the owner's own screenshots, plus the spellings a
          # customer would actually type for one of them.
          for q in 'RK - 0118' 'RK-0118' 'rk0118' 'PA - 1201' 'WL - 1716' 'Krishna' 'Blue'; do
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote_plus(sys.argv[1]))" "$q")
            got=''
            for try in 1 2 3; do
              # -L matters more than it looks: this site redirects a search URL
              # (trailing slash, currency cookie), and curl WITHOUT -L returns
              # the empty body of the 301 and exits 0. Every page the previous
              # run measured was zero bytes, which reads as "no products found"
              # and is really "no page fetched".
              if curl -fsSL --max-time 60 -H "User-Agent: ${UA}" \
                   -o /tmp/s.html "https://theartframer.us/?s=${enc}&cb=$(date +%s)$try"; then
                got=1; break
              fi
              sleep 8
            done
            if [ -z "$got" ]; then
              echo "  '$q' -> host did not answer after 3 tries"
              continue
            fi
            python3 - "$q" <<'PY'
          import re, sys
          h = open('/tmp/s.html', encoding='utf-8', errors='replace').read()
          q = sys.argv[1]
          nothing = 'Nothing Found' in h or 'nothing matched your search' in h.lower()
          # Any /product/ link, however the permalink is written — absolute,
          # protocol-relative or root-relative. The first version of this check
          # demanded the full https://theartframer.us/ form and reported zero
          # products for every query including ones that plainly had results,
          # which measured the pattern rather than the page.
          prods = set(re.findall(r'/product/([a-z0-9][a-z0-9\-]{2,})/', h))
          heads = [re.sub(r'<[^>]+>', '', x).strip()[:60]
                   for x in re.findall(r'<h2[^>]*>(.{0,300}?)</h2>', h, re.S)][:3]
          print("  %-12s %-14s bytes:%-8d products:%-3d %s" % (
              repr(q), 'NOTHING FOUND' if nothing else 'has results',
              len(h), len(prods), ('e.g. ' + sorted(prods)[0]) if prods else ''))
          if heads:
              print("               headings: " + ' | '.join(h2 for h2 in heads if h2))
          PY
          done
          echo ""
          echo "A line reading NOTHING FOUND with 0 products is the bug still present."
