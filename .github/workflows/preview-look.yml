name: Preview Look
# How pages LOOK and BEHAVE, in a real browser, with some plugins unloaded and
# their theme ports doing the work - next to the same pages as they are now -
# without switching anything off for visitors. Preview Ports (preview-ports.yml)
# compares the HTML; this drives Chromium (tools/preview-look.mjs): slideshows
# started and moving, pictures, arrows, dots, breadcrumbs, the footer bar, a
# screenshot of the first screen, at desktop and phone width.
#
# The same one-run secret as Preview Ports: for the length of the run
# tools/port-preview-dropin.php sits in as wp-content/db.php (loaded before any
# plugin; tools/port-preview-ctl.sh) with a secret made for this run, and only
# requests carrying it leave the named plugins unloaded (never cached, nothing
# kept). It is removed at the end, whatever happens, and does nothing after
# 45 minutes in any case. The run fails, rather than reporting SAME, when the
# file cannot be put in place or a page is not answered as a preview.
on:
  workflow_dispatch:
    inputs:
      skip:
        description: 'Plugin folders to leave unloaded (comma separated)'
        required: true
        default: 'elementor-pro'
      urls:
        description: 'Pages (paths), space separated'
        required: true
        default: '/ /shop/ /product-category/digital-canvas-prints/'
      styles:
        description: 'Also compare every element''s size and styles (yes/no)'
        required: false
        default: 'no'
concurrency:
  group: port-preview
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKIP: ${{ github.event.inputs.skip }}
      URLS: ${{ github.event.inputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the inputs
        run: |
          set -euo pipefail
          case "$SKIP" in *[!a-z0-9,-]*|'') echo "bad skip list"; exit 1;; esac
          for u in $URLS; do case "$u" in /*) ;; *) echo "paths only"; exit 1;; esac; case "$u" in *[!A-Za-z0-9/_.?=\&-]*) echo "bad path: $u"; exit 1;; esac; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium
      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Put the preview file in place (this run only)
        env:
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_DEST: ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}
        run: |
          set -euo pipefail
          AF_PV=$(openssl rand -hex 24); echo "::add-mask::$AF_PV"; echo "AF_PV=$AF_PV" >> "$GITHUB_ENV"
          AF_PV=$AF_PV bash tools/port-preview-ctl.sh put
      - name: Look at each page both ways
        env:
          AF_SKIP: ${{ github.event.inputs.skip }}
          AF_URLS: ${{ github.event.inputs.urls }}
          AF_STYLES: ${{ github.event.inputs.styles == 'yes' && '1' || '' }}
        run: node tools/preview-look.mjs
      - name: Remove the preview file (always)
        if: always()
        env:
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_DEST: ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}
        run: bash tools/port-preview-ctl.sh remove
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-look-screenshots
          path: persona-look-*.png
          if-no-files-found: ignore
