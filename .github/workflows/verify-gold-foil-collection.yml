name: Verify Gold Foil Collection

# The owner's check, run by a real browser: walk the homepage's "Shop by
# Collection" tab strip, find Gold Foiled & UV in it, click it, and see whether
# the products and the circle row underneath change.
#
# A browser is the only thing that can answer this. inc/goldfoil-collection.php
# puts the tab there two different ways — a term filter the theme renders from,
# and a clone the browser builds when the theme's own list leaves the section
# out — and fetching HTML would only ever see the first.
#
# Manual trigger: a handful of page views, no server changes.
on: workflow_dispatch

concurrency:
  group: verify-gold-foil-collection
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56 >/dev/null
          npx playwright install --with-deps chromium

      - name: Find and click the Gold Foiled & UV tab
        run: node tools/verify-goldfoil-collection.mjs

      - name: Upload before/after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-foil-collection-screens
          path: |
            gf-before.png
            gf-after.png
          if-no-files-found: ignore
