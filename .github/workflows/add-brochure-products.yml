name: Add Brochure Products

# Create shop products for brochure pages that nothing sells.
#
# The caption audit counted 156 of the 373 artwork pages with no product behind
# them. Two sections are covered so far, and the "csv" box picks which:
#
#   blank (default)  tools/brochure-products-still-life.csv   17 pages
#   wildlife         tools/brochure-products-wildlife.csv     14 pages
#
# Still Life is the worst section in the book at 17 of 23 pages unsold;
# Wildlife is next at 14 of 23.
#
# The tool refuses rather than guesses. No price is invented — it comes from the
# theme's own rate card for the size the product is titled as. No product is
# created without artwork, without an existing category, or on top of an art
# code some product already carries.
#
# Leave both boxes unticked first. The run prints every product it would create,
# its price, the image it found and the SKU, and writes nothing.
#
# Tick "apply" and the products are created as DRAFTS — invisible to customers
# until someone publishes them from Products -> Drafts. Tick "publish" as well
# only when they should go live immediately.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create the products (leave off to preview the plan only)
        type: boolean
        default: false
      publish:
        description: Publish immediately instead of creating drafts
        type: boolean
        default: false
      csv:
        description: Which section to create (blank = Still Life)
        type: choice
        options:
          - ''
          - wildlife
        default: ''
      probe:
        description: Only ask how the artwork files are named, create nothing
        type: boolean
        default: false

jobs:
  add-products:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # The sibling workflows shrug a failed scp off and run whatever the last
      # deploy left on the server. Not here: this tool creates products, and a
      # silently stale copy of it acting on a fresh CSV — or on a CSV that is
      # not there at all — is worse than a run that does not happen.
      - name: Send the tool and the data up
        run: |
          set -uo pipefail
          if ! scp -P "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
                   tools/add-brochure-products.php tools/brochure-products-*.csv \
                   "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:~/websites/OPu0sKi4J/public_html/wp-content/themes/postero-child/tools/"; then
            echo "::error::Could not send the tool to the server. Nothing ran, and the copy already up there was NOT used."
            exit 1
          fi

      # The pictures, when there are any. A row whose file is absent is refused
      # by name rather than created without one, so an empty folder is a safe
      # state and not a reason to stop.
      - name: Send the artwork up
        run: |
          set -uo pipefail
          count=$(find tools/artwork -type f ! -name 'README.md' 2>/dev/null | wc -l)
          echo "  artwork files in this checkout: ${count}"
          if [ "${count}" -gt 0 ]; then
            scp -r -P "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -i ~/.ssh/id_ed25519 \
                tools/artwork \
                "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:~/websites/OPu0sKi4J/public_html/wp-content/themes/postero-child/tools/" \
              || echo "  scp failed — rows whose picture did not arrive will be refused by name"
          fi

      - name: Create the products
        timeout-minutes: 22
        run: |
          set -uo pipefail
          rc=0
          ssh -p "${{ secrets.HOSTINGER_PORT }}" -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 \
              "${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}" \
            "cd ~/websites/OPu0sKi4J/public_html && \
             PROBE=${{ inputs.probe == true && '1' || '0' }} \
             APPLY=${{ inputs.apply == true && '1' || '0' }} \
             STATUS=${{ inputs.publish == true && 'publish' || 'draft' }} \
             CSV='${{ inputs.csv != '' && format('wp-content/themes/postero-child/tools/brochure-products-{0}.csv', inputs.csv) || '' }}' \
             wp eval-file wp-content/themes/postero-child/tools/add-brochure-products.php --allow-root 2>&1" \
            || rc=$?
          # 255 is ssh's own failure — refused, timed out, auth. The run did not
          # happen, and a green tick saying otherwise is how a dead connection
          # gets read as a clean dry run. Anything else is the tool's own exit
          # and stays tolerated, because "refused 17 rows" is a real answer.
          if [ "$rc" -eq 255 ]; then
            echo "::error::SSH could not reach the host (exit 255) — nothing ran. The host rate-limits repeated logins; leave a few minutes between runs."
            exit 1
          fi
          exit 0
